<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ECON 10760 Exam Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a university exam portal. Top bar with five views; content in one centred column.
   Past papers are blue ink on paper; AI predictions are amber with a dashed edge, so the two never look alike. */
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface2:#eef0f4;--line:#d9dde5;--fg:#16202e;--muted:#566275;
  --accent:#1f4aa8;--accent-fg:#ffffff;--accent-soft:#e3ebfa;
  --pred:#8a5a00;--pred-bg:#fff4d9;--pred-line:#d9a431;
  --ok:#14724a;--ok-bg:#e2f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;--warn:#8a5a00;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520;--surface:#172030;--surface2:#1e2a3d;--line:#2c3a52;--fg:#e8edf5;--muted:#9aa8bd;
  --accent:#7ea6ff;--accent-fg:#0b1220;--accent-soft:#1c2b4a;
  --pred:#f0be5a;--pred-bg:#33270c;--pred-line:#a9801f;
  --ok:#59d19a;--ok-bg:#12301f;--bad:#ff8c84;--bad-bg:#3a1714;--warn:#f0be5a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520;--surface:#172030;--surface2:#1e2a3d;--line:#2c3a52;--fg:#e8edf5;--muted:#9aa8bd;
  --accent:#7ea6ff;--accent-fg:#0b1220;--accent-soft:#1c2b4a;
  --pred:#f0be5a;--pred-bg:#33270c;--pred-line:#a9801f;
  --ok:#59d19a;--ok-bg:#12301f;--bad:#ff8c84;--bad-bg:#3a1714;--warn:#f0be5a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:18px;margin-right:auto;padding-bottom:8px}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav button:hover{color:var(--fg)}
.theme{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin-bottom:8px;color:var(--muted);font-size:13px}
main{padding-top:22px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.muted{color:var(--muted)}.small{font-size:13px}
.mono{font-family:var(--mono)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chip{display:inline-block;font:500 12px/1.4 var(--mono);padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.chip.past{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.pred{background:var(--pred-bg);color:var(--pred);border:1px dashed var(--pred-line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--pred-bg);color:var(--warn);border-color:transparent}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
select,input[type=text],input[type=search],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%;color:var(--fg)}
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode b{font-size:15px}.mode span{font-size:13px;color:var(--muted)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .v{font:500 26px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
/* question */
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q.pred{border:1px dashed var(--pred-line);background:linear-gradient(var(--surface),var(--surface))}
.banner{background:var(--pred-bg);color:var(--pred);border:1px dashed var(--pred-line);border-radius:6px;padding:8px 12px;font:500 12px/1.4 var(--mono);letter-spacing:.03em;overflow-wrap:anywhere}
.stem{font:400 18px/1.55 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:14px;min-width:260px}
.tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;font-variant-numeric:tabular-nums}
.tbl th{background:var(--surface2)}
.opts{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font:500 13px var(--mono);width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.fb{border-radius:6px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .why{white-space:pre-wrap;overflow-wrap:anywhere}
.ev{border-left:3px solid var(--pred-line);padding-left:12px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--mono)}
.pal button.ans{background:var(--accent-soft);border-color:var(--accent)}
.pal button.cur{outline:2px solid var(--fg);outline-offset:1px}
.timer{font:500 18px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
/* bank */
.item{border-bottom:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item .s{font:400 15px/1.5 var(--serif);overflow-wrap:anywhere}
.item.pred{border-left:3px dashed var(--pred-line);padding-left:12px}
/* charts */
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr 70px;gap:4px 10px;align-items:center;font-size:13px}
.hb .lab{min-width:0;overflow-wrap:anywhere}
.hb .num{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.hb .bar{height:12px;border-radius:2px}
.hb .bar i.pr{background:var(--pred-line)}
.hb .bar i.bad{background:var(--bad)}.hb .bar i.good{background:var(--ok)}
.heat{border-collapse:collapse;font-size:13px;min-width:560px;width:100%}
.heat th,.heat td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.heat th:first-child,.heat td:first-child{text-align:left}
.heat td.z{color:var(--muted);background:var(--surface2)}
.heat td.h1{background:var(--accent-soft)}.heat td.h2{background:var(--accent-soft);font-weight:600}.heat td.h3{background:var(--accent);color:var(--accent-fg);font-weight:600}
.scroll{overflow-x:auto}
svg text{fill:var(--muted);font:11px var(--mono)}
.ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:10px}
.sticky-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
@media (max-width:520px){.stem{font-size:17px}.q{padding:14px}.hb{grid-template-columns:1fr 60px}.hb .bar{grid-column:1/3;order:3}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>

</head><body>

<script>
const DATA={"P":[{"id":"P001","n":1,"kind":"past","topic":"GDP and national accounts","stem":"When economists use market values to aggregate output, they sum the:","table":null,"opts":[["A","number of items produced."],["B","quantity of items produced."],["C","price times the quantity of each item produced."],["D","social value of items produced."],["E","amount of each item produced."]],"ans":"C","expl":"GDP = ΣPX; prices are the weights.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":1}],"verified":"official","flag":null,"sub":"G1","subtopic":"GDP definition and measurement","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P002","n":2,"kind":"past","topic":"GDP and national accounts","stem":"The value of goods produced, but unsold, in the current period is:","table":null,"opts":[["A","excluded from GDP."],["B","counted in GDP as inventory investment."],["C","counted in GDP as consumption spending."],["D","counted in GDP as services."],["E","allocated to GDP in future periods."]],"ans":"B","expl":"produced but unsold output counts as inventory investment.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":2},{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":24}],"verified":"official","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P003","n":3,"kind":"past","topic":"GDP and national accounts","stem":"Nominal GDP measures the ________ of production.","table":null,"opts":[["A","change in the volume"],["B","base year value"],["C","physical volume"],["D","change in the market value"],["E","current euro value"]],"ans":"E","expl":"nominal means valued at current prices.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":3}],"verified":"official","flag":null,"sub":"G1","subtopic":"GDP definition and measurement","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P004","n":4,"kind":"past","topic":"GDP and national accounts","stem":"Three equivalent ways to measure GDP are total _____, total _____, and total ______.","table":null,"opts":[["A","profits; production; saving"],["B","production; income; expenditure"],["C","expenditure; income; profits"],["D","revenue; profits; production"],["E","investment; consumption; saving"]],"ans":"B","expl":"production (value added), income and expenditure.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":25}],"verified":"worked","flag":null,"sub":"G1","subtopic":"GDP definition and measurement","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P005","n":5,"kind":"past","topic":"GDP and national accounts","stem":"Educational services provided by public schools to students for free are:","table":null,"opts":[["A","included in GDP at market prices."],["B","included in GDP at cost."],["C","excluded from GDP because they are not sold in markets."],["D","excluded from GDP because they are intermediate goods."],["E","excluded from GDP because they are publicly provided."]],"ans":"B","expl":"government-provided services are valued at cost (e.g. teachers' wages are government purchases).","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":22}],"verified":"worked","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P006","n":6,"kind":"past","topic":"GDP and national accounts","stem":"In 2001, Pete Rich purchases a painting done by Rembrandt in 1642 for $20 million. He also pays a one percent commission to the auction house that sold the painting. What is the contribution of this transaction to GDP in 2001?","table":null,"opts":[["A","$0"],["B","$200,000"],["C","$2 million"],["D","$20 million"],["E","$20.2 million"]],"ans":"B","expl":"the 1642 painting is a used item and does not count. Only the 1% commission (1% × $20m = $200,000) is new production.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":1}],"verified":"worked","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P007","n":7,"kind":"past","topic":"GDP and national accounts","stem":"In the year 2000 Janice Quinn sells a five-year-old car to Used Car Inc. for €3,000. In the same year Used Car Inc. resells the car to Ima Goner for €3,500. What is the contribution of this transaction to GDP in the year 2000?","table":null,"opts":[["A","€0"],["B","€500"],["C","€3,000"],["D","€3,500"],["E","€6,500"]],"ans":"B","expl":"only the dealer's margin (3,500 − 3,000 = €500) is new production.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":6},{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":13}],"verified":"official","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P008","n":8,"kind":"past","topic":"GDP and national accounts","stem":"Given the following data for an economy, compute the value of GDP.","table":[["Consumption expenditures","50"],["Imports","40"],["Government purchases of goods and services","20"],["Construction of new homes and apartments","30"],["Sales of existing homes and apartments","40"],["Exports","50"],["Government payments to retirees","10"],["Household purchases of durable goods","20"],["Beginning-of-year inventory","10"],["End-of-year inventory","20"],["Business fixed investment","30"]],"opts":[["A","130"],["B","140"],["C","150"],["D","160"],["E","320"]],"ans":"C","expl":"C 50 + I (30 new homes + 30 business + 10 inventory change = 70) + G 20 + NX (50 − 40 = 10) = 150. Durables are already in C. Existing homes and retiree payments are excluded.","ansnote":"150","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":2}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Hard"},{"id":"P009","n":9,"kind":"past","topic":"GDP and national accounts","stem":"Given the following data for an economy, compute the investment component of GDP.","table":[["Consumption expenditures","1,000"],["Imports","600"],["Government purchases of goods and services","700"],["Construction of new homes and apartments","500"],["Sales of existing homes and apartments","600"],["Exports","500"],["Government payments to retirees","200"],["Household purchases of durable goods","300"],["Beginning-of-year inventory","500"],["End-of-year inventory","600"],["Business fixed investment","300"]],"opts":[["A","300"],["B","400"],["C","800"],["D","900"],["E","1,500"]],"ans":"D","expl":"new homes 500 + business fixed 300 + inventory change (600 − 500 = 100) = 900.","ansnote":"900","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":11}],"verified":"official","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Hard"},{"id":"P010","n":10,"kind":"past","topic":"GDP and national accounts","stem":"An economy produces only 500,000 tables valued at $100 each. Of these, 100,000 are sold to consumers, 200,000 to businesses, 100,000 to the government and 50,000 abroad. No tables are imported. The unsold tables at the end of the year are held in inventory by the table manufacturers. What is the value of GDP?","table":null,"opts":[["A","$5 million"],["B","$40 million"],["C","$45 million"],["D","$50 million"],["E","$95 million"]],"ans":"D","expl":"all 500,000 tables are produced, so 500,000 × $100 = $50m. Unsold ones are inventory investment.","ansnote":"$50 million","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":4}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P011","n":11,"kind":"past","topic":"GDP and national accounts","stem":"An economy produces only 1,000,000 computers valued at €2,000 each. Of these, 200,000 are sold to consumers, 300,000 to businesses, 300,000 to the government and 100,000 abroad. No computers are imported. At the end of the year, the computer manufacturers hold the unsold computers in inventory. What is the value of GDP?","table":null,"opts":[["A","€0.9 billion"],["B","€1.0 billion"],["C","€1.8 billion"],["D","€2.0 billion"]],"ans":"D","expl":"1,000,000 × €2,000. Unsold computers are inventory investment.","ansnote":"€2.0 billion","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":27}],"verified":"official","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P012","n":12,"kind":"past","topic":"GDP and national accounts","stem":"The Citrus Growers Association grows €1 million worth of oranges. It sells €500,000 worth of oranges to consumers and uses the rest to make orange juice that it sells to consumers for €3 million. The Citrus Growers' contribution to GDP is:","table":null,"opts":[["A","€500,000"],["B","€1,000,000"],["C","€3,500,000"],["D","€4,000,000"]],"ans":"C","expl":"final goods are €0.5m of oranges plus €3m of juice. Value added: 1m + (3m − 0.5m) = 3.5m.","ansnote":"€3.5m","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":25}],"verified":"official","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P013","n":13,"kind":"past","topic":"GDP and national accounts","stem":"Which of the following expenditures would increase the investment component of GDP?","table":null,"opts":[["A","You purchase a new house."],["B","You purchase a new car."],["C","You purchase 1,000 shares of stock."],["D","You pay a commission to your stockbroker for selling some stocks that you owned."]],"ans":"A","expl":"new housing is investment. Shares and commissions on existing assets are not.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":26}],"verified":"official","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P014","n":14,"kind":"past","topic":"GDP and national accounts","stem":"Peg's Manicure Manor did 4,000 sets of nails in the year 2000 and 4,500 in the year 2001. The price of a set of nails was €20 in 2000 and €22 in 2001. If the year 2000 is the base year, Peg's contribution to nominal GDP in 2000 was _____ and in 2001 was _______.","table":null,"opts":[["A","€80,000; €88,000"],["B","€88,000; €90,000"],["C","€80,000; €90,000"],["D","€90,000; €99,000"],["E","€80,000; €99,000"]],"ans":"E","expl":"2000: 4,000 × 20 = 80,000. 2001: 4,500 × 22 = 99,000 (nominal uses current prices).","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":26}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P015","n":15,"kind":"past","topic":"GDP and national accounts","stem":"One shortcoming of GDP as an indicator of society's social well-being is that it fails to measure:","table":null,"opts":[["A","growth in productivity."],["B","increase in the quantity of goods."],["C","non-market production."],["D","change in the price level."],["E","increase in the number of imported goods."]],"ans":"C","expl":"GDP misses non-market production.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":3}],"verified":"worked","flag":null,"sub":"G4","subtopic":"Limits of GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P016","n":16,"kind":"past","topic":"GDP and national accounts","stem":"GDP excludes important factors that affect people's well-being, such as the value of:","table":null,"opts":[["A","unpaid housekeeping services."],["B","government purchases of goods and services."],["C","services purchased by households."],["D","goods produced domestically, but sold to foreigners."],["E","capital goods purchased by firms."]],"ans":"A","expl":"unpaid housework is non-market, so excluded.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":5}],"verified":"official","flag":null,"sub":"G4","subtopic":"Limits of GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P017","n":17,"kind":"past","topic":"GDP and national accounts","stem":"A drawback of using market values to aggregate the quantities of goods and services produced in an economy is that:","table":null,"opts":[["A","higher-priced items count more."],["B","GDP increases when not all goods are produced in greater quantities."],["C","market prices generally reflect the economic benefit consumers expect to receive from an item."],["D","not all economically valuable goods and services are bought and sold in markets."],["E","lower-priced items count more."]],"ans":"D","expl":"not everything of value is bought and sold in markets.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":14}],"verified":"official","flag":null,"sub":"G4","subtopic":"Limits of GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P018","n":18,"kind":"past","topic":"GDP and national accounts","stem":"The greater demand for paid childcare services as women's labour force participation increases represents primarily:","table":null,"opts":[["A","an increase in economic activity."],["B","a switch from market to non-market production."],["C","a switch from non-market to market production."],["D","a decrease in economic activity."],["E","a decrease in GDP."]],"ans":"C","expl":"childcare moves from unpaid to paid, so measured GDP rises.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":5}],"verified":"worked","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P019","n":19,"kind":"past","topic":"GDP and national accounts","stem":"The value of unpaid childcare services provided by a stay-at-home dad _____ included in GDP and the value of day care services purchased from a licensed childcare provider _______ included in GDP.","table":null,"opts":[["A","is; is not"],["B","is; is"],["C","is not; is not"],["D","is not; is"],["E","is sometimes; is"]],"ans":"D","expl":"unpaid childcare is not counted; purchased day care is.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":24}],"verified":"official","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P020","n":20,"kind":"past","topic":"GDP and national accounts","stem":"High-real GDP countries tend to have ______ infant mortality rates and ______ literacy rates than low-real GDP countries.","table":null,"opts":[["A","higher; higher"],["B","lower; lower"],["C","higher; lower"],["D","equivalent; lower"],["E","lower; higher"]],"ans":"E","expl":"richer countries have lower infant mortality and higher literacy (correlation, not causation).","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":25}],"verified":"official","flag":null,"sub":"G4","subtopic":"Limits of GDP","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P021","n":21,"kind":"past","topic":"GDP and national accounts","stem":"The sum of the value added by all firms equals total:","table":null,"opts":[["A","profits."],["B","after-tax revenue."],["C","spending on capital goods."],["D","value of final goods and services."],["E","investment spending."]],"ans":"D","expl":"summing value added across all firms gives the value of final goods and services, because each stage of production is counted once and intermediate goods are never double counted. Profits, revenue and capital spending are only pieces of it.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":2}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P022","n":22,"kind":"past","topic":"GDP and national accounts","stem":"Total income of capital and labour must equal total:","table":null,"opts":[["A","production."],["B","profits."],["C","revenue."],["D","consumption."],["E","investment."]],"ans":"A","expl":"production = income = expenditure. Income earned by labour and capital (wages, profits, rent) is the income side of GDP and equals the value produced.","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":5}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P023","n":23,"kind":"past","topic":"GDP and national accounts","stem":"Bob's Barber Shop cut 3,000 heads of hair in the year 2020 and 3,100 in the year 2021. The price of a haircut was €7 in 2020 and €8 in 2021. If the year 2020 is the base year, what was Bob's contribution to nominal GDP in the year 2021?","table":null,"opts":[["A","€21,000"],["B","€21,700"],["C","€24,000"],["D","€24,800"],["E","€25,000"]],"ans":"D","expl":"nominal GDP uses current prices: 3,100 × €8 = €24,800. B (€21,700) is 3,100 × €7, which is 2021 output valued at base-year prices (real GDP).","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":4}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P024","n":24,"kind":"past","topic":"GDP and national accounts","stem":"The government expenditure component of GDP includes:","table":null,"opts":[["A","purchases of final goods and services."],["B","interest payments on government debt."],["C","transfer payments."],["D","pensions paid to government workers."],["E","payments made to social security recipients."]],"ans":"A","expl":"G counts only government purchases of goods and services. Interest on the debt, transfer payments, pensions and social security payments are transfers, not purchases, so they are excluded.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":5}],"verified":"worked","flag":null,"sub":"G2","subtopic":"What counts in GDP","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P025","n":25,"kind":"past","topic":"GDP and national accounts","stem":"If an automobile manufacturer pays €200 for a car windshield, €400 for four car tires and €100 for a car CD player, and sells cars made with these parts for €20,000, then each car the manufacturer sells contributes how much to GDP?","table":null,"opts":[["A","€19,300"],["B","€20,000"],["C","€20,200"],["D","€20,400"],["E","€20,700"]],"ans":"B","expl":"the car is a final good, so its market price of €20,000 is what enters GDP. The €700 of parts are intermediate goods whose value is already inside that price, so adding them (C, D, E) double counts. A (€19,300) is the manufacturer's own value added (20,000 − 700), which is the answer only if the question asks about that firm's value added rather than about the car. FLAG: no key exists for this paper, so confirm if you can.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":23}],"verified":"worked","flag":"Two readings are possible (B: the car is a final good worth EUR 20,000; A: the firm's own value added, EUR 19,300). The source paper has no answer key, so check this one.","sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P026","n":26,"kind":"past","topic":"GDP and national accounts","stem":"An economy produces 500,000 tables valued at €100 each. Households purchase 100,000 tables, of which 50,000 are imported. Businesses purchase 200,000 domestically produced tables. The government purchases 100,000 domestically produced tables and 50,000 domestically produced tables are sold abroad. The unsold tables at the end of the year are held in inventory by the table manufacturers. What is the value of the investment component of GDP?","table":null,"opts":[["A","€10 billion"],["B","€20 million"],["C","€25 million"],["D","€30 million"],["E","€50 million"]],"ans":"D","expl":"500,000 tables are produced. Sales of domestic output: households 50,000 (the other 50,000 are imports, not part of this output) + businesses 200,000 + government 100,000 + exports 50,000 = 400,000, so 100,000 are unsold. Investment = business purchases 200,000 + inventory 100,000 = 300,000 tables × €100 = €30 million.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":25}],"verified":"worked","flag":null,"sub":"G3","subtopic":"GDP calculations","paperlabels":null,"type":"Calculation","diff":"Hard"},{"id":"P027","n":27,"kind":"past","topic":"GDP and national accounts","stem":"Although GDP is not the same as economic well-being, high levels of GDP are positively correlated with all of the following EXCEPT:","table":null,"opts":[["A","longer life expectancies."],["B","better health."],["C","higher rates of literacy."],["D","higher rates of infant mortality."],["E","higher material standards of living."]],"ans":"D","expl":"richer countries have lower infant mortality, not higher. Life expectancy, health, literacy and living standards all rise with GDP (a correlation, not proof of causation).","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":6}],"verified":"worked","flag":null,"sub":"G4","subtopic":"Limits of GDP","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P028","n":28,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The Consumer Price Index measures the cost of:","table":null,"opts":[["A","a fixed basket of goods and services."],["B","a basket of goods and services that changes each year."],["C","all goods and services purchased by consumers."],["D","goods and services required to live above the poverty level."],["E","a basket of goods and services excluding luxuries."]],"ans":"A","expl":"the CPI prices a fixed base-year basket.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":6}],"verified":"official","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P029","n":29,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The consumer price index for the current year measures the cost of a standard basket in the ______ year relative to the cost of the same basket in the ______ year.","table":null,"opts":[["A","current; base"],["B","current; current"],["C","base; index"],["D","base; current"]],"ans":"A","expl":"cost of the basket in the current year relative to its cost in the base year.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":7}],"verified":"worked","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P030","n":30,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Suppose that the total expenditures for a typical household in 2018 equalled $2,500 per month, while the cost of purchasing exactly the same items in 2020 was $3,000. If 2018 is the base year, the CPI for 2020 equals:","table":null,"opts":[["A","0.83"],["B","1.00"],["C","1.20"],["D","1.25"]],"ans":"C","expl":"3,000 / 2,500.","ansnote":"1.20","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":13},{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":28}],"verified":"official","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P031","n":31,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Use Table 1 (quantities and prices in years 1 and 2). If the year 1 quantities represent a base-year basket of goods and services bought by a representative household, the year 2 CPI is _____ and the inflation rate is _____.","table":[["Year","Quantity A","Price A","Quantity B","Price B"],["1 (base year)","100","€2","30","€10"],["2","105","€2.10","35","€10.50"]],"opts":[["A","101; 1%"],["B","102; 2%"],["C","103; 3%"],["D","104; 4%"],["E","105; 5%"]],"ans":"E","expl":"use base-year quantities. Year 2 cost = 100 × 2.10 + 30 × 10.50 = 525. Year 1 cost = 200 + 300 = 500. CPI = 525/500 = 1.05, so 105 and 5% inflation. Using year-2 quantities is the trap.","ansnote":"105; 5%","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":8}],"verified":"official","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"Calculation","diff":"Hard"},{"id":"P032","n":32,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"If the consumer price index increased from 1.52 to 1.65, then it must be the case that ______ relative to prices in the base year.","table":null,"opts":[["A","all prices rose"],["B","the weighted average level of prices rose"],["C","all prices fell"],["D","some prices rose, and some prices fell"]],"ans":"B","expl":"the CPI is a weighted average; individual prices can move either way.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":8}],"verified":"worked","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P033","n":33,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"In 1929 the CPI equalled 0.171 and in 1930 the CPI equalled 0.167. These data provide evidence of a period of:","table":null,"opts":[["A","inflation."],["B","deflation."],["C","trade deficit."],["D","expansion."]],"ans":"B","expl":"the CPI fell, so deflation.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":9}],"verified":"worked","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P034","n":34,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The CPI in year one equalled 1.55. The CPI in year two equalled 1.64. The rate of inflation between years one and two was _____ percent.","table":null,"opts":[["A","4.0"],["B","5.5"],["C","5.8"],["D","6.4"],["E","9.0"]],"ans":"C","expl":"(1.64 − 1.55) / 1.55 = 5.8%.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":27}],"verified":"worked","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P035","n":35,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The rate of inflation is the:","table":null,"opts":[["A","price level."],["B","consumer price index."],["C","annual percentage change in the price level."],["D","the average price of a given class of goods or services relative to the price of the same goods and services in a base year."],["E","the average price of goods whose prices have changed relative to the prices of goods whose prices have not changed since the base year."]],"ans":"C","expl":"inflation is the percentage change in the price level.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":26}],"verified":"official","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P036","n":36,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Changes in the Consumer Price Index (CPI) may overstate the \"true\" rate of inflation because:","table":null,"opts":[["A","it does not fully account for changes in the quality of goods and services."],["B","it excludes the prices of imported goods and services."],["C","it excludes the prices of intermediate goods and services."],["D","it includes goods which impose other costs on society such as petrol, alcohol and tobacco."],["E","it is influenced by changes in taxes such as VAT and excise."]],"ans":"A","expl":"unaccounted quality improvement (and substitution) makes the CPI overstate inflation. The official key appears to have also accepted E, but A is the answer supported by the lectures.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":10}],"verified":"official","flag":"The official key appears to have accepted both A and E. A is the answer supported by the lectures.","sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P037","n":37,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"When consumers substitute a cheaper good for a more expensive one, the CPI will ______ change in the cost of living.","table":null,"opts":[["A","equal the"],["B","overstate the"],["C","understate the"],["D","register no"],["E","precisely measure the"]],"ans":"B","expl":"a fixed basket ignores substitution, so it overstates the rise in the cost of living.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":30}],"verified":"worked","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P038","n":38,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"All of the following are nominal quantities EXCEPT the:","table":null,"opts":[["A","price of a new car."],["B","wages paid to workers in a restaurant."],["C","cost of purchasing a new computer."],["D","number of new houses built in one month."],["E","salary offered to a new college graduate."]],"ans":"D","expl":"a physical count of houses is a real quantity. The rest are in money terms.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":7}],"verified":"official","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P039","n":39,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"All of the following are real quantities except the:","table":null,"opts":[["A","number of new cars produced in one year."],["B","tons of steel shipped to South America."],["C","millions of computer chips shipped to computer makers."],["D","billions of dollars invested in stocks."]],"ans":"D","expl":"dollars invested are nominal. The rest are physical quantities.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":10}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P040","n":40,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"All of the following are real quantities except the:","table":null,"opts":[["A","number of new cars produced in one year."],["B","tons of steel shipped to South America."],["C","millions of computer chips shipped to computer makers."],["D","billions of euros invested in inventories."]],"ans":"D","expl":"euros invested in inventories is nominal.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":29}],"verified":"official","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P041","n":41,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"A quantity measured in terms of current euro value is called a(n) _______ quantity.","table":null,"opts":[["A","nominal"],["B","real"],["C","deflated"],["D","indexed"],["E","relative"]],"ans":"A","expl":"nominal means measured in current money.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":28}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P042","n":42,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The practice of increasing a nominal quantity each period by an amount equal to the percentage increase in a specified price index is called:","table":null,"opts":[["A","a substitution bias."],["B","indexing."],["C","the Fisher effect."],["D","a quality adjustment."],["E","deflating."]],"ans":"B","expl":"indexing.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":29}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P043","n":43,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Kathy was paid 10 euro per hour in 2021 and is being paid 15 euro per hour in 2025. The CPI in 2021 was 100 and the CPI in 2025 is 140. Kathy's real wage:","table":null,"opts":[["A","has increased"],["B","has decreased"],["C","has remained the same"],["D","cannot be determined with the information provided"]],"ans":"A","expl":"real wage = nominal / CPI. 2021: 10 / 1.00 = 10. 2025: 15 / 1.40 = 10.71, so it increased.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":4}],"verified":"official","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P044","n":44,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"If workers received a 5 percent wage increase and the rate of inflation was 10 percent, then their real wage:","table":null,"opts":[["A","increased."],["B","decreased."],["C","remained constant."],["D","equalled the nominal wage."]],"ans":"B","expl":"nominal +5% against prices +10% is a real fall.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":11}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P045","n":45,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"If your wage stays constant at the same number of euros per hour, when there is inflation, your nominal wage _____ and your real wage _____.","table":null,"opts":[["A","remains constant; falls"],["B","increases; falls"],["C","remains constant; remains constant"],["D","increases; increases"],["E","remains constant; increases"]],"ans":"A","expl":"nominal is unchanged; real falls as prices rise.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":27}],"verified":"official","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P046","n":46,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"If the nominal interest rate is 10 percent and the inflation rate is 3 percent, then the real interest rate is approximately:","table":null,"opts":[["A","3 percent."],["B","7 percent."],["C","10 percent."],["D","13 percent."]],"ans":"B","expl":"r ≈ i − π = 10% − 3% = 7%.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":12}],"verified":"worked","flag":null,"sub":"P4","subtopic":"Real and nominal interest rates","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P047","n":47,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"What is the relationship between the nominal interest rate (i), the real interest rate (r), and inflation (π)?","table":null,"opts":[["A","Roughly r = π − i"],["B","Exactly r = π − i"],["C","Roughly r = i − π"],["D","Exactly r = i − π"],["E","Roughly r = i / π"]],"ans":"C","expl":"roughly r = i − π. The exact version is r = (i − π) / (1 + π).","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":29}],"verified":"official","flag":null,"sub":"P4","subtopic":"Real and nominal interest rates","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P048","n":48,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"For a given nominal interest rate, an unexpectedly high inflation rate ______ the real interest rate.","table":null,"opts":[["A","increases"],["B","decreases"],["C","has no impact on"],["D","may either increase or decrease"]],"ans":"B","expl":"r ≈ i − π, so higher actual inflation lowers the real rate.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":30}],"verified":"official","flag":null,"sub":"P4","subtopic":"Real and nominal interest rates","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P049","n":49,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The consumer price index for an economy consists of only two items: books and hamburgers. In 2020, the base year, the typical consumer purchased 10 books for €25 each and 25 hamburgers for €2 each. In 2023, the typical consumer purchased 15 books for €30 each and 30 hamburgers for €3 each. The consumer price index for 2023 equals:","table":null,"opts":[["A","1.00"],["B","1.08"],["C","1.15"],["D","1.25"],["E","1.80"]],"ans":"D","expl":"use the base-year basket (10 books, 25 hamburgers). Base cost = 10 × 25 + 25 × 2 = 300. The same basket at 2023 prices = 10 × 30 + 25 × 3 = 375. CPI = 375/300 = 1.25. Using 2023 quantities is the trap: (15 × 30 + 30 × 3)/(15 × 25 + 30 × 2) = 540/435 = 1.24.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":8}],"verified":"worked","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P050","n":50,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The CPI is all of the following EXCEPT the:","table":null,"opts":[["A","rate of inflation between the current period and the base year."],["B","cost of living relative to the base year."],["C","average level of prices relative to prices in the base year."],["D","consumer price index."],["E","cost of a standard basket of goods and services relative to the cost of the same basket in the base year."]],"ans":"A","expl":"the CPI is a price level (the cost of the basket relative to the base year). Inflation is the percentage change in the CPI between two periods, so it is not the CPI.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":9}],"verified":"worked","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P051","n":51,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"If the CPI equalled 1.00 in 1995 and 1.65 in 2000, and a typical household's income equalled €35,000 in 1995 and €40,000 in 2000, then between 1995 and 2000, real household income:","table":null,"opts":[["A","increased."],["B","may have increased or decreased."],["C","decreased."],["D","cannot be determined."],["E","was constant."]],"ans":"C","expl":"real income = nominal / CPI. 1995: 35,000 / 1.00 = 35,000. 2000: 40,000 / 1.65 = 24,242. Real income fell: nominal income rose about 14% but prices rose 65%.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":11}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P052","n":52,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Kathy was paid 10 euro per hour in 2021 and is being paid 15 euro per hour in 2023. The CPI in 2021 was 120 and the CPI in 2023 is 140. Kathy's real wage:","table":null,"opts":[["A","has increased"],["B","has decreased"],["C","has remained the same"],["D","cannot be determined with the information provided"]],"ans":"A","expl":"2021: 10 / 1.20 = 8.33. 2023: 15 / 1.40 = 10.71. The real wage increased (nominal pay up 50%, prices up about 17%).","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":7}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P053","n":53,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Suppose a new computer model is introduced to replace a model included in the CPI basket. The price of the new model is 5 percent higher than the discontinued model, but the new model also includes additional features. In this situation the CPI will tend to _____ inflation as a result of _____ bias.","table":null,"opts":[["A","overstate; substitution"],["B","overstate; quality adjustment"],["C","understate; substitution"],["D","understate; quality adjustment"],["E","accurately measure; substitution"]],"ans":"B","expl":"part of the 5% price rise pays for better features, so the true price rise is smaller, but the CPI records all of it as inflation. That is quality adjustment bias, and the CPI overstates inflation. Substitution bias is about consumers switching between goods.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":12}],"verified":"worked","flag":null,"sub":"P1","subtopic":"CPI: definition and calculation","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P054","n":54,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"Inflation makes it difficult to distinguish relative price changes from changes in the general level of prices. Consequently, inflation ________ the efficiency of the market system.","table":null,"opts":[["A","increases"],["B","may either increase or decrease"],["C","decreases"],["D","improves"],["E","does not change"]],"ans":"C","expl":"when all prices drift up, people and firms struggle to tell a relative price change (a signal) from general inflation, and waste effort on tracking prices. So inflation lowers the efficiency of the market system.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":13}],"verified":"worked","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P055","n":55,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The CPI in year one equalled 1.45. The CPI in year two equalled 1.51. The rate of inflation between years one and two was _____ percent.","table":null,"opts":[["A","4.0"],["B","4.1"],["C","4.5"],["D","5.1"],["E","6.0"]],"ans":"B","expl":"(1.51 − 1.45) / 1.45 = 0.0414, or 4.1%.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":26}],"verified":"worked","flag":null,"sub":"P2","subtopic":"Inflation rate and CPI bias","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P056","n":56,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"To correct a nominal quantity for changes in the price level, one should:","table":null,"opts":[["A","add a price index to it."],["B","subtract a price index from it."],["C","divide it by a price index."],["D","multiply it by a price index."],["E","increase it by a percentage equal to the rate of inflation for that year."]],"ans":"C","expl":"real value = nominal value / price index. Adding, subtracting or multiplying are wrong, and the CPI is a level, not a percentage.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":27}],"verified":"worked","flag":null,"sub":"P3","subtopic":"Real vs nominal values","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P057","n":57,"kind":"past","topic":"Prices, CPI, real and nominal values, interest rates","stem":"The real interest rate is the:","table":null,"opts":[["A","market interest rate."],["B","annual percentage increase in the nominal value of a financial asset."],["C","annual percentage increase in the purchasing power of a financial asset."],["D","the interest rate charged on a loan in euro terms."],["E","the interest rate paid on a loan in euro terms."]],"ans":"C","expl":"the real interest rate is the annual percentage increase in the purchasing power (baskets of goods) of a financial asset. The nominal rate is the percentage rise in its euro value.","ansnote":"","sources":[{"code":"MT22","paper":"Midterm","session":"Fall 2022","course":"ECON10760","year":"2022/23","q":14}],"verified":"worked","flag":null,"sub":"P4","subtopic":"Real and nominal interest rates","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P058","n":58,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"All of the following are characteristics of short-term economic fluctuations EXCEPT:","table":null,"opts":[["A","expansions and recessions are felt throughout the economy."],["B","expansions and recessions are irregular in length and severity."],["C","unemployment falls sharply during recessions."],["D","durable-goods industries are more sensitive to short-term fluctuations than service and non-durable industries."],["E","recessions tend to be followed by a decline in inflation."]],"ans":"C","expl":"unemployment rises in recessions, so that statement is the false one.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":1}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P059","n":59,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"Potential output is:","table":null,"opts":[["A","the same as actual output."],["B","the same as the output gap."],["C","the same as the natural rate of unemployment."],["D","the amount of output produced when resources are used at normal rates."],["E","the amount of output produced when there is an expansionary gap."]],"ans":"D","expl":"potential output is output at the normal rate of resource use, not the maximum possible.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":2}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P060","n":60,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"In an expansion, the cyclical rate of unemployment:","table":null,"opts":[["A","is positive."],["B","is zero."],["C","is negative."],["D","equals the natural rate of unemployment."],["E","equals the sum of the frictional and structural unemployment rates."]],"ans":"C","expl":"in an expansion u is below the natural rate, so cyclical unemployment (u − u*) is negative.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":3}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P061","n":61,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"The increase in the unemployment rate during a recession is associated with which type of unemployment?","table":null,"opts":[["A","Frictional unemployment"],["B","Cyclical unemployment"],["C","Structural unemployment"],["D","Nominal unemployment"]],"ans":"B","expl":"cyclical unemployment.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":11}],"verified":"official","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P062","n":62,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"When firms preset prices in the short term, economy-wide spending changes are the primary cause of:","table":null,"opts":[["A","frictional unemployment."],["B","the growth of potential output."],["C","output gaps."],["D","structural unemployment."],["E","inflation."]],"ans":"C","expl":"with preset prices, spending changes cause output gaps.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":4}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P063","n":63,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"The costs of changing prices are referred to by economists as ___ costs.","table":null,"opts":[["A","scarcity"],["B","average variable"],["C","shoe leather"],["D","menu"],["E","opportunity"]],"ans":"D","expl":"menu costs.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":5}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P064","n":64,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"The basic Keynesian model is built on the key assumption that:","table":null,"opts":[["A","menu costs are not significant."],["B","firms meet the demand for their products at preset prices."],["C","firms price their products so as to sell a preset quantity of output."],["D","prices are prevented from changing frequently by government regulations."]],"ans":"B","expl":"firms meet demand at preset prices (menu costs).","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":14}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P065","n":65,"kind":"past","topic":"Recessions, output gaps, unemployment, Keynesian assumption","stem":"The key assumption of the basic Keynesian model is that in the short run, firms ______.","table":null,"opts":[["A","meet demand at preset prices"],["B","adjust prices to bring sales in line with capacity"],["C","change prices frequently"],["D","operate just as they do in the long run"],["E","produce potential output"]],"ans":"A","expl":"with menu costs, firms meet demand at preset prices, so output is determined by spending. Adjusting prices to match capacity belongs to the longer-run models.","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":11}],"verified":"worked","flag":null,"sub":"K1","subtopic":"Fluctuations, gaps and unemployment","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P066","n":66,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"If the marginal propensity to consume equals 0.75, then a €100 increase in after-tax disposable income leads to an increase in consumption of:","table":null,"opts":[["A","€0.25"],["B","€0.75"],["C","€25"],["D","€75"],["E","€100"]],"ans":"D","expl":"0.75 × 100 = €75.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":9}],"verified":"official","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P067","n":67,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"The marginal propensity to consume (MPC) is the:","table":null,"opts":[["A","amount by which disposable income increases when consumption increases by €1."],["B","amount by which consumption increases when disposable income increases by €1."],["C","percentage by which consumption increases when disposable income increases by 1 percent."],["D","percentage by which disposable income increases when consumption increases by 1 percent."]],"ans":"B","expl":"MPC is extra consumption per extra €1 of disposable income.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":14},{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":10}],"verified":"official","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P068","n":68,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"The portion of planned aggregate expenditure that depends on output is called ______ expenditure.","table":null,"opts":[["A","potential"],["B","planned"],["C","actual"],["D","autonomous"],["E","induced"]],"ans":"E","expl":"induced expenditure depends on output; autonomous does not.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":7}],"verified":"worked","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P069","n":69,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"When real output increases, planned aggregate expenditures increase because:","table":null,"opts":[["A","autonomous expenditures increase."],["B","autonomous expenditures decrease."],["C","induced expenditures increase."],["D","induced expenditures decrease."]],"ans":"C","expl":"induced expenditure rises with output.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":15}],"verified":"official","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P070","n":70,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"All of the following would be included in planned aggregate expenditure except:","table":null,"opts":[["A","spending on consumer durables."],["B","planned changes in inventories."],["C","sales of domestically produced goods to foreigners."],["D","interest paid on the government debt."]],"ans":"D","expl":"interest on government debt is a transfer, not a purchase. Planned inventory changes are in I, and exports are in NX.","ansnote":"","sources":[{"code":"MT23","paper":"Midterm","session":"Fall 2023","course":"ECON10760","year":"2023/24","q":15},{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":12}],"verified":"official","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P071","n":71,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Selene's Mirror Company expects to sell €1,000,000 worth of mirrors and to produce €1,250,000 worth of mirrors in the coming year. The company purchases €300,000 worth of new equipment during the year. Sales for the year turn out to be €900,000. Actual investment by Selene's Mirror Company equals ______ and planned investment equals _______.","table":null,"opts":[["A","€300,000; €250,000"],["B","€650,000; €550,000"],["C","€550,000; €450,000"],["D","€450,000; €300,000"]],"ans":"B","expl":"unplanned inventory = production 1.25m − sales 0.9m = 350,000, so actual I = 300,000 + 350,000 = 650,000. Planned inventory = 1.25m − 1.0m = 250,000, so planned I = 300,000 + 250,000 = 550,000.","ansnote":"€650,000; €550,000","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":5},{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":13}],"verified":"official","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P072","n":72,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"The expenditure line in the Keynesian cross diagram represents the:","table":null,"opts":[["A","equilibrium condition that Y = PAE."],["B","relationship between planned expenditure and income."],["C","relationship between consumption and after-tax disposable income."],["D","equilibrium condition that Y = Y*."],["E","equilibrium condition that u = u*."]],"ans":"B","expl":"the PAE line relates planned expenditure to income. The 45° line is Y = PAE.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":10}],"verified":"worked","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P073","n":73,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In Econland autonomous consumption equals 700, the marginal propensity to consume equals 0.80, net taxes are fixed at 50, planned investment is fixed at 100, government purchases are fixed at 100, and net exports are fixed at 40. Induced expenditure equals:","table":null,"opts":[["A","0.20Y"],["B","990 + 0.20Y"],["C","0.80Y"],["D","900 + 0.80Y"]],"ans":"C","expl":"induced expenditure is cY = 0.80Y. (Autonomous = 700 − 0.8 × 50 + 100 + 100 + 40 = 900.)","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":16}],"verified":"official","flag":null,"sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P074","n":74,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In Macroland autonomous consumption equals 100, the marginal propensity to consume equals 0.75, net taxes are fixed at 40, planned investment is fixed at 50, government purchases are fixed at 150, and net exports are fixed at 20. Short-run equilibrium output in this economy equals:","table":null,"opts":[["A","387"],["B","1,000"],["C","1,150"],["D","1,160"],["E","1,280"]],"ans":"D","expl":"E = 100 − 0.75 × 40 + 50 + 150 + 20 = 290. Y = 290 / (1 − 0.75) = 1,160.","ansnote":"1,160","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":8}],"verified":"worked","flag":null,"sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P075","n":75,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"When PAE = 200 + 0.5Y, short-run equilibrium output equals:","table":null,"opts":[["A","200"],["B","400"],["C","600"],["D","800"],["E","1,200"]],"ans":"B","expl":"Y = 200 / (1 − 0.5). Figure restated as an equation.","ansnote":"400","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":9}],"verified":"worked","flag":"The original question used a diagram. It has been restated here as an equation; the wording of the stem is adapted for that reason.","sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P076","n":76,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In a Keynesian cross, PAE = 400 + 0.5Y. If autonomous spending falls from 400 to 200, the new short-run equilibrium output will equal:","table":null,"opts":[["A","200"],["B","400"],["C","600"],["D","800"],["E","1,200"]],"ans":"B","expl":"new PAE = 200 + 0.5Y, so Y = 200 / 0.5 = 400 (down from 800). Figure restated as an equation.","ansnote":"400","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":12}],"verified":"official","flag":"The original question used a diagram. It has been restated here as an equation; the wording of the stem is adapted for that reason.","sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P077","n":77,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"When PAE = 600 + 0.5Y, short-run equilibrium output equals:","table":null,"opts":[["A","1,200"],["B","400"],["C","600"],["D","800"]],"ans":"A","expl":"Y = 600 / 0.5. Figure restated as an equation.","ansnote":"1,200","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":17}],"verified":"official","flag":"The original question used a diagram. It has been restated here as an equation; the wording of the stem is adapted for that reason.","sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P078","n":78,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In a Keynesian cross, PAE = 500 + 0.9Y and potential output Y* = 4,000. At short-run equilibrium output:","table":null,"opts":[["A","there is a recessionary gap."],["B","there is an expansionary gap."],["C","output equals potential output."],["D","firms will be producing more than they can sell."],["E","firms will be producing less than they can sell."]],"ans":"B","expl":"Y = 500 / (1 − 0.9) = 5,000, above Y* = 4,000, so an expansionary gap (Y > Y*). At equilibrium firms sell exactly what they produce, so D and E cannot be right. Figure restated as an equation. In the real exam the label was hard to read and the lecturer also accepted A or C, so read axis labels carefully.","ansnote":"","sources":[{"code":"MT25","paper":"Midterm","session":"Fall 2025","course":"ECON10760","year":"2025/26","q":15}],"verified":"official","flag":"The original question used a diagram. It has been restated here as an equation; the wording of the stem is adapted for that reason.","sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P079","n":79,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"If planned aggregate expenditure (PAE) in an economy equals 2,000 + 0.8Y and potential output (Y*) equals 11,000, then this economy has:","table":null,"opts":[["A","an expansionary gap."],["B","a recessionary gap."],["C","no output gap."],["D","no autonomous expenditure."]],"ans":"B","expl":"Y = 2,000 / 0.2 = 10,000, below Y* = 11,000, so a recessionary gap.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":18}],"verified":"official","flag":null,"sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P080","n":80,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In the basic Keynesian model an increase in autonomous spending:","table":null,"opts":[["A","reduces short-run equilibrium output."],["B","increases short-run equilibrium output."],["C","reduces potential output."],["D","increases potential output."],["E","moves short-run equilibrium output to potential output."]],"ans":"B","expl":"higher autonomous spending raises equilibrium output and leaves potential output alone.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":11}],"verified":"worked","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P081","n":81,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In the Keynesian model, a €1 billion increase in autonomous consumption leads to ______ in short-run equilibrium output.","table":null,"opts":[["A","a €1 billion increase"],["B","a €1 billion decrease"],["C","a greater than €1 billion increase"],["D","more than a €1 billion decrease"],["E","no change"]],"ans":"C","expl":"the multiplier 1/(1 − c) is greater than 1.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":13}],"verified":"worked","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P082","n":82,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"A reduction in the real interest rate __________ the incentive to invest and thus _________ equilibrium Y.","table":null,"opts":[["A","increases, decreases"],["B","decreases, increases"],["C","increases, increases"],["D","decreases, decreases"],["E","does not change, does not change"]],"ans":"C","expl":"a lower real interest rate raises the incentive to invest, which raises PAE and Y.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":12}],"verified":"worked","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P083","n":83,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"A fall in the interest rate brought about by an increase in the money supply decreases the cost of borrowing and thus such a policy ____________","table":null,"opts":[["A","increases output."],["B","reduces output."],["C","is not a good idea if one wishes to close a recessionary gap."],["D","is always a goal of the central bank."],["E","is never a goal of the central bank."]],"ans":"A","expl":"a lower interest rate raises investment and output. It is a tool for closing a recessionary gap.","ansnote":"","sources":[{"code":"F25","paper":"Final e
