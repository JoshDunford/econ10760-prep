function setNav(){
  const items=[['home','Practice'],['bank','Question bank'],['dash','Dashboard'],['analysis','Exam analysis']];
  $('#nav').innerHTML=items.map(([k,l])=>'<button type="button" data-view="'+k+'"'+((view===k||(view==='quiz'&&k==='home'))?' aria-current="page"':'')+'>'+l+'</button>').join('');
}
const MODES={
 past:['Past Paper Practice','Authentic questions only, by paper or year, with immediate feedback.'],
 pred:['AI Predictions','AI-written questions only, with confidence and the evidence behind each.'],
 mixed:['Mixed Practice','Past and predicted together. Every question is labelled.'],
 exam:['Exam Simulation','Randomised, timed, no feedback until you submit.'],
 topic:['Topic-Based Practice','Choose a topic or subtopic and practise only that.'],
 wrong:['Incorrect Answers','Retry what you got wrong. Tracks which ones you later fix.']
};
function opt(list,sel,all){return (all!=null?'<option value="">'+all+'</option>':'')+list.map(([v,l])=>'<option value="'+esc(v)+'"'+(String(sel)===String(v)?' selected':'')+'>'+esc(l)+'</option>').join('')}
const paperOpts=()=>CODE_ORDER.map(c=>[c,paperName(c)+' · '+PAPERS[c].year]);
const topicOpts=()=>TOPICS.map(t=>[t,t]);
const subOpts=()=>{const s={};ALL.forEach(q=>{s[q.topic+'||'+q.subtopic]=1});return Object.keys(s).map(k=>[k,k.split('||')[1]])};
function viewHome(){
  const m=mode,c=S.cfg||{};
  const mi=missed(),rc=recovered();
  let h='<div class="sec"><h2>Choose a practice mode</h2><p class="muted">'+PAST.length+' authentic questions from '+CODE_ORDER.length+' papers and '+PRED.length+' AI-written predictions. Progress saves in this browser.'+(canStore?'':' <b>Storage is blocked here, so progress will be lost when you close the page.</b>')+'</p></div>';
  h+='<div class="modes">'+Object.entries(MODES).map(([k,[n,d]])=>'<button type="button" class="mode" data-act="mode" data-m="'+k+'" aria-pressed="'+(m===k)+'"><b>'+n+'</b><span>'+d+'</span></button>').join('')+'</div>';
  h+='<div class="card sec"><h3>'+MODES[m][0]+'</h3><div class="grid g3">';
  const cnt=(id,v,opts)=>'<label class="f">Questions<select id="'+id+'">'+opts.map(n=>'<option value="'+n+'"'+(String(v)===String(n)?' selected':'')+'>'+(n==='all'?'All available':n)+'</option>').join('')+'</select></label>';
  const ord='<label class="f">Order<select id="c-ord"><option value="orig"'+(c.ord==='orig'?' selected':'')+'>Original order</option><option value="rand"'+(c.ord!=='orig'?' selected':'')+'>Randomised</option></select></label>';
  if(m==='past'){
    h+='<label class="f">Paper<select id="c-paper">'+opt(paperOpts(),c.paper,'All papers')+'</select></label>';
    h+='<label class="f">Year<select id="c-year">'+opt(years.map(y=>[y,y]),c.year,'All years')+'</select></label>'+cnt('c-n',c.n||'all',['all',10,20,30,50])+ord;
  }else if(m==='pred'){
    h+='<label class="f">Topic<select id="c-topic">'+opt(topicOpts(),c.topic,'All topics')+'</select></label>';
    h+='<label class="f">Confidence<select id="c-conf">'+opt([['High','High'],['Medium','Medium'],['Low','Low']],c.conf,'Any confidence')+'</select></label>'+cnt('c-n',c.n||'all',['all',10,20])+ord;
  }else if(m==='mixed'){
    h+='<label class="f">Topic<select id="c-topic">'+opt(topicOpts(),c.topic,'All topics')+'</select></label>'+cnt('c-n',c.n||20,[10,20,30,50]);
  }else if(m==='exam'){
    h+='<label class="f">Question pool<select id="c-pool"><option value="past"'+(c.pool==='past'?' selected':'')+'>Past-paper questions</option><option value="mixed"'+(c.pool==='mixed'?' selected':'')+'>Past and predicted</option><option value="pred"'+(c.pool==='pred'?' selected':'')+'>Predictions only</option></select></label>';
    h+='<label class="f">Topic<select id="c-topic">'+opt(topicOpts(),c.topic,'All topics')+'</select></label>'+cnt('c-n',c.n||15,[10,15,20,30,40]);
    h+='<label class="f">Time limit (minutes)<input id="c-min" type="number" min="1" max="180" value="'+(c.min||60)+'"></label>';
  }else if(m==='topic'){
    h+='<label class="f">Topic or subtopic<select id="c-sub"><option value="">Choose…</option>'+TOPICS.map(t=>'<optgroup label="'+esc(t)+'"><option value="T::'+esc(t)+'"'+(c.sub==='T::'+t?' selected':'')+'>All of: '+esc(sh(t))+'</option>'+subOpts().filter(s=>s[0].split('||')[0]===t).map(s=>'<option value="'+esc(s[0])+'"'+(c.sub===s[0]?' selected':'')+'>'+esc(s[1])+'</option>').join('')+'</optgroup>').join('')+'</select></label>';
    h+='<label class="f">Questions from<select id="c-org"><option value="">Past and predicted</option><option value="past"'+(c.org==='past'?' selected':'')+'>Past papers only</option><option value="pred"'+(c.org==='pred'?' selected':'')+'>Predictions only</option></select></label>'+cnt('c-n',c.n||'all',['all',10,20])+ord;
  }else{
    h+='<div style="grid-column:1/-1"><p><b>'+mi.length+'</b> question'+(mi.length===1?'':'s')+' currently wrong (your latest attempt was incorrect). Of '+rc.ever+' you have ever missed, <b>'+rc.rec+'</b> are now answered correctly.</p></div>'+ord;
  }
  h+='</div><div class="row"><button type="button" class="btn primary" data-act="start"'+(m==='wrong'&&!mi.length?' disabled':'')+'>'+(m==='exam'?'Start exam':'Start practice')+'</button>'+(m==='exam'?'<span class="small muted">The real midterm is 15 multiple-choice questions in 60 minutes with no negative marking.</span>':'')+'<span id="startmsg" class="small" style="color:var(--bad)"></span></div></div>';
  return h;
}
function readCfg(){
  const g=id=>{const e=$('#'+id);return e?e.value:undefined};
  const c=Object.assign({},S.cfg||{});
  ['paper','year','topic','conf','ord','pool','sub','org'].forEach(k=>{const v=g('c-'+k);if(v!==undefined)c[k]=v});
  const n=g('c-n');if(n!==undefined)c.n=n==='all'?'all':+n;
  const mn=g('c-min');if(mn!==undefined)c.min=Math.max(1,Math.min(180,+mn||60));
  S.cfg=c;save();return c;
}
function startQuiz(){
  const c=readCfg();let pool=[],title=MODES[mode][0],exam=false,limit=0,random=c.ord!=='orig';
  if(mode==='past')pool=PAST.filter(q=>matches(q,{paper:c.paper,year:c.year}));
  else if(mode==='pred')pool=PRED.filter(q=>matches(q,{topic:c.topic,conf:c.conf}));
  else if(mode==='mixed'){pool=ALL.filter(q=>matches(q,{topic:c.topic}));random=true}
  else if(mode==='exam'){const src=c.pool==='pred'?PRED:c.pool==='mixed'?ALL:PAST;pool=src.filter(q=>matches(q,{topic:c.topic}));exam=true;random=true;limit=(c.min||60)*60}
  else if(mode==='topic'){
    if(!c.sub){$('#startmsg').textContent='Choose a topic first.';return}
    const t=c.sub.startsWith('T::')?{topic:c.sub.slice(3)}:{topic:c.sub.split('||')[0],sub:c.sub.split('||')[1]};
    pool=ALL.filter(q=>matches(q,{topic:t.topic,origin:c.org})&&(!t.sub||q.subtopic===t.sub));
  }else{pool=missed().map(id=>BY[id])}
  if(!pool.length){$('#startmsg').textContent='No questions match those settings.';return}
  if(!random)pool=pool.slice().sort((a,b)=>(a.origin===b.origin?(a.origin==='past'?a.n-b.n:a.n-b.n):a.origin==='past'?-1:1));
  else pool=shuffle(pool);
  if(c.n&&c.n!=='all'&&mode!=='wrong')pool=pool.slice(0,c.n);
  launch(pool.map(q=>q.id),title,exam,limit);
}
function launch(ids,title,exam,limit,m){
  quiz={ids:[...new Set(ids)],title,exam,limit,i:0,sel:{},done:{},start:Date.now(),finished:false,mode:m||mode,left:limit};
  view='quiz';render();if(exam)tick();
}
let tmr=null;
function tick(){clearInterval(tmr);tmr=setInterval(()=>{
  if(!quiz||!quiz.exam||quiz.finished){clearInterval(tmr);return}
  quiz.left=Math.max(0,quiz.limit-Math.floor((Date.now()-quiz.start)/1000));
  const e=$('#timer');if(e){e.textContent=fmt(quiz.left);e.classList.toggle('low',quiz.left<300)}
  if(quiz.left<=0){finishExam()}
},500)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function viewQuiz(){
  const z=quiz;
  if(z.finished)return viewResults();
  const id=z.ids[z.i],q=BY[id],n=z.ids.length;
  let h='<div class="row"><h2>'+esc(z.title)+'</h2><span class="sp"></span>'+(z.exam?'<span class="timer'+(z.left<300?' low':'')+'" id="timer" aria-label="Time left">'+fmt(z.left)+'</span>':'')+'<button type="button" class="btn sm" data-act="quit">'+(z.exam?'Abandon':'End session')+'</button></div>';
  const answered=z.exam?Object.keys(z.sel).length:Object.keys(z.done).length;
  h+='<div><div class="row small muted"><span>Progress: '+answered+' of '+n+' '+(z.exam?'answered':'completed')+'</span></div><div class="bar" style="margin-top:4px"><i style="width:'+(answered/n*100)+'%"></i></div></div>';
  const sub=!!z.done[id];
  h+=qCard(q,{num:z.i+1,total:n,sel:z.sel[id],submitted:!z.exam&&sub,exam:z.exam});
  h+='<div class="sticky-act">';
  if(z.exam){
    h+='<button type="button" class="btn" data-act="prev"'+(z.i===0?' disabled':'')+'>Previous</button><button type="button" class="btn" data-act="next"'+(z.i===n-1?' disabled':'')+'>Next</button><span class="sp"></span>';
  }else{
    if(!sub)h+='<button type="button" class="btn primary" data-act="submit"'+(z.sel[id]?'':' disabled')+'>Submit answer</button>';
    else h+='<button type="button" class="btn primary" data-act="next">'+(z.i===n-1?'Finish and see summary':'Next question')+'</button>';
    h+='<span class="sp"></span>';
  }
  h+='<button type="button" class="btn sm" data-act="bm" data-id="'+id+'">'+(S.bm[id]?'Remove bookmark':'Bookmark')+'</button><button type="button" class="btn sm" data-act="fl" data-id="'+id+'">'+(S.fl[id]?'Unflag':'Flag as confusing')+'</button></div>';
  if(z.exam){
    h+='<div class="card sec"><div class="small muted">Jump to a question</div><div class="pal">'+z.ids.map((x,i)=>'<button type="button" data-act="go" data-i="'+i+'" class="'+(z.sel[x]?'ans ':'')+(i===z.i?'cur':'')+'" aria-label="Question '+(i+1)+(z.sel[x]?', answered':'')+'">'+(i+1)+'</button>').join('')+'</div>';
    h+=z.confirm?'<div class="fb bad"><div>'+(n-answered)+' question'+(n-answered===1?' is':'s are')+' unanswered. Submit anyway?</div><div class="row"><button type="button" class="btn danger" data-act="finish">Submit exam</button><button type="button" class="btn" data-act="cancelconf">Keep working</button></div></div>':'<div><button type="button" class="btn primary" data-act="finish">Submit exam</button></div>';
    h+='</div>';
  }
  return h;
}
function finishExam(){
  const z=quiz;if(!z||z.finished)return;
  z.finished=true;z.took=Math.min(z.limit,Math.floor((Date.now()-z.start)/1000));
  z.ids.forEach(id=>{if(z.sel[id])record(id,z.sel[id],'exam');else{/* unanswered: counted as not answered, not saved as an attempt */}});
  clearInterval(tmr);render();
}
function viewResults(){
  const z=quiz,n=z.ids.length;
  const ans=z.ids.filter(id=>z.sel[id]),ok=ans.filter(id=>z.sel[id]===BY[id].ans);
  const skipped=n-ans.length;
  let h='<div class="sec"><h2>'+(z.exam?'Exam results':'Session summary')+'</h2></div>';
  h+='<div class="tiles"><div class="tile"><div class="v">'+ok.length+'/'+n+'</div><div class="l">Score</div></div><div class="tile"><div class="v">'+Math.round(ok.length/n*100)+'%</div><div class="l">Of all questions</div></div><div class="tile"><div class="v">'+(ans.length-ok.length)+'</div><div class="l">Incorrect</div></div>'+(z.exam?'<div class="tile"><div class="v">'+skipped+'</div><div class="l">Unanswered</div></div><div class="tile"><div class="v">'+fmt(z.took||0)+'</div><div class="l">Time used</div></div>':'')+'</div>';
  // by origin
  const po=z.ids.filter(i=>BY[i].origin==='past'),pr=z.ids.filter(i=>BY[i].origin==='pred');
  const acc=l=>l.length?Math.round(l.filter(i=>z.sel[i]===BY[i].ans).length/l.length*100)+'% ('+l.filter(i=>z.sel[i]===BY[i].ans).length+'/'+l.length+')':'none in this session';
  h+='<div class="card small">Past-paper questions: <b>'+acc(po)+'</b> · AI predictions: <b>'+acc(pr)+'</b></div>';
  h+='<div class="row"><button type="button" class="btn primary" data-act="home">Back to practice</button>'+(z.ids.some(i=>z.sel[i]!==BY[i].ans)?'<button type="button" class="btn" data-act="retrywrong">Retry the ones I missed</button>':'')+'</div>';
  h+='<div class="sec"><h3>Review</h3>'+z.ids.map((id,i)=>{const q=BY[id],s=z.sel[id];
    return '<details class="card"><summary style="cursor:pointer"><span class="chip '+(s?(s===q.ans?'ok':'bad'):'')+'">'+(s?(s===q.ans?'Correct':'Incorrect'):'Unanswered')+'</span> <span class="mono small muted">Q'+(i+1)+'</span> '+esc(q.stem.slice(0,110))+(q.stem.length>110?'…':'')+'</summary><div style="margin-top:12px">'+qCard(q,{num:i+1,total:n,sel:s,submitted:true})+'</div></details>'}).join('')+'</div>';
  return h;
}

/* ---------- bank ---------- */
function bankList(){return ALL.filter(q=>matches(q,F)).sort((a,b)=>a.origin===b.origin?a.n-b.n:a.origin==='past'?-1:1)}
function viewBank(){
  const list=bankList(),per=20,pages=Math.max(1,Math.ceil(list.length/per));if(bankPage>pages)bankPage=pages;
  let h='<div class="sec"><h2>Question bank</h2><p class="muted">'+ALL.length+' questions: '+PAST.length+' past-paper, '+PRED.length+' AI predictions. Showing '+list.length+'.</p></div>';
  h+='<div class="card sec"><div class="grid g3">';
  h+='<label class="f">Search<input id="f-q" type="search" value="'+esc(F.q)+'" placeholder="e.g. multiplier, CPI, reserves"></label>';
  h+='<label class="f">Origin<select id="f-origin">'+opt([['past','Authentic past paper'],['pred','AI prediction']],F.origin,'All')+'</select></label>';
  h+='<label class="f">Paper<select id="f-paper">'+opt(paperOpts(),F.paper,'All papers')+'</select></label>';
  h+='<label class="f">Year<select id="f-year">'+opt(years.map(y=>[y,y]),F.year,'All years')+'</select></label>';
  h+='<label class="f">Topic<select id="f-topic">'+opt(topicOpts(),F.topic,'All topics')+'</select></label>';
  h+='<label class="f">Question type<select id="f-type">'+opt(types.map(t=>[t,t]),F.type,'All types')+'</select></label>';
  h+='<label class="f">Difficulty (estimated)<select id="f-diff">'+opt([['Easy','Easy'],['Medium','Medium'],['Hard','Hard']],F.diff,'Any')+'</select></label>';
  h+='<label class="f">Your status<select id="f-status">'+opt([['new','Not attempted'],['wrong','Latest attempt wrong'],['right','Latest attempt right'],['bm','Bookmarked'],['fl','Flagged']],F.status,'Any')+'</select></label>';
  h+='</div><div class="row"><button type="button" class="btn sm" data-act="clearf">Clear filters</button><span class="sp"></span><button type="button" class="btn primary sm" data-act="practf"'+(list.length?'':' disabled')+'>Practise these '+list.length+' (randomised)</button>';
  h+=confirmReset?'<span class="small">Erase all attempts, bookmarks and flags?</span><button type="button" class="btn danger sm" data-act="reset2">Yes, reset</button><button type="button" class="btn sm" data-act="reset0">Cancel</button>':'<button type="button" class="btn danger sm" data-act="reset1">Reset all progress</button>';
  h+='</div></div>';
  h+='<div class="card">'+(list.length?list.slice((bankPage-1)*per,bankPage*per).map(bankItem).join(''):'<p class="muted">No questions match. Clear a filter or change the search.</p>')+'</div>';
  if(pages>1)h+='<div class="row"><button type="button" class="btn sm" data-act="pg" data-d="-1"'+(bankPage<=1?' disabled':'')+'>Previous</button><span class="small muted">Page '+bankPage+' of '+pages+'</span><button type="button" class="btn sm" data-act="pg" data-d="1"'+(bankPage>=pages?' disabled':'')+'>Next</button></div>';
  return h;
}
function bankItem(q){
  const l=latest(q.id),open=!!bankOpen[q.id];
  let h='<div class="item '+(q.origin==='pred'?'pred':'')+'">';
  h+=q.origin==='pred'?'<div class="banner">AI PREDICTION – NOT AN AUTHENTIC PAST-PAPER QUESTION</div>':'';
  h+=tagRow(q)+'<div class="s">'+esc(q.stem.length>260&&!open?q.stem.slice(0,260)+'…':q.stem)+'</div>';
  h+='<div class="row small muted"><span>'+esc(q.type)+' · '+esc(q.diff)+'</span>'+(l?'<span class="chip '+(l.ok?'ok':'bad')+'">Latest: '+(l.ok?'correct':'incorrect')+'</span>':'<span class="chip">Not attempted</span>')+bankChips(q)+'</div>';
  if(open){
    h+=tableHtml(q)+'<ul class="opts">'+q.opts.map(([k,t])=>'<li class="opt" style="cursor:default"><span class="k">'+k+'</span><span class="t">'+esc(t)+'</span></li>').join('')+'</ul>';
    if(bankOpen[q.id]==='ans')h+=explainHtml(q,null);
    const hh=hist(q.id);
    h+=hh.length?'<div class="small"><b>Your previous answers</b><ul class="ul">'+hh.slice().reverse().map(a=>'<li>'+new Date(a.t).toLocaleDateString()+': chose '+a.sel+' ('+(a.ok?'correct':'incorrect')+', '+esc(a.mode)+')</li>').join('')+'</ul></div>':'<div class="small muted">No attempts yet.</div>';
  }
  h+='<div class="row"><button type="button" class="btn sm" data-act="bopen" data-id="'+q.id+'">'+(open?'Collapse':'Expand')+'</button>'+(open?'<button type="button" class="btn sm" data-act="bans" data-id="'+q.id+'">'+(bankOpen[q.id]==='ans'?'Hide answer':'Show answer and explanation')+'</button>':'')+'<button type="button" class="btn sm" data-act="bm" data-id="'+q.id+'">'+(S.bm[q.id]?'Remove bookmark':'Bookmark')+'</button><button type="button" class="btn sm" data-act="fl" data-id="'+q.id+'">'+(S.fl[q.id]?'Unflag':'Flag')+'</button><button type="button" class="btn sm" data-act="retry1" data-id="'+q.id+'">'+(l?'Retry':'Try')+'</button></div></div>';
  return h;
}

/* ---------- dashboard ---------- */
function pct(a,b){return b?Math.round(a/b*100):0}
function bars(rows,cls){ // rows: {label,ok,n}
  return '<div class="hb">'+rows.map(r=>{const p=pct(r.ok,r.n);return '<div class="lab">'+esc(r.label)+'</div><div class="bar" role="img" aria-label="'+p+' percent"><i class="'+(cls||(r.n&&p<60?'bad':r.n&&p>=80?'good':''))+'" style="width:'+(r.n?p:0)+'%"></i></div><div class="num">'+(r.n?p+'% · '+r.ok+'/'+r.n:'no data')+'</div>'}).join('')+'</div>';
}
function agg(keyf){const m={};S.att.forEach(a=>{const q=BY[a.id];if(!q)return;(keyf(q)).forEach(k=>{const o=m[k]||(m[k]={ok:0,n:0});o.n++;if(a.ok)o.ok++})});return m}
function viewDash(){
  const att=S.att.filter(a=>BY[a.id]);
  if(!att.length)return '<div class="sec"><h2>Dashboard</h2></div><div class="card sec"><p><b>No attempts yet.</b></p><p class="muted">Answer some questions in any practice mode and this page fills in: accuracy, results by topic and paper, past papers against AI predictions, your trend, and the topics to revise first.</p><div><button type="button" class="btn primary" data-act="home">Start practising</button></div></div>';
  const ok=att.filter(a=>a.ok).length,uniq=new Set(att.map(a=>a.id)).size,rc=recovered(),mi=missed();
  let h='<div class="sec"><h2>Dashboard</h2></div><div class="tiles">';
  [[pct(ok,att.length)+'%','Overall accuracy'],[att.length,'Attempts'],[uniq,'Different questions'],[ok,'Correct'],[att.length-ok,'Incorrect'],[mi.length,'Wrong right now']].forEach(([v,l])=>h+='<div class="tile"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>');
  h+='</div>';
  const byTop=agg(q=>[q.topic]);
  const trows=TOPICS.map(t=>({label:sh(t),ok:(byTop[t]||{}).ok||0,n:(byTop[t]||{}).n||0}));
  h+='<div class="card sec"><h3>Accuracy by topic</h3>'+bars(trows)+'<p class="small muted">Red below 60%, green from 80%. Topics with fewer than 5 attempts are shown but not used for recommendations.</p></div>';
  const bo=agg(q=>[q.origin]);
  const po=bo.past||{ok:0,n:0},pp=bo.pred||{ok:0,n:0};
  let cmp='';
  if(po.n>=5&&pp.n>=5){const d=pct(po.ok,po.n)-pct(pp.ok,pp.n);cmp=Math.abs(d)<8?'Your accuracy on familiar past-paper questions and unfamiliar predictions is similar.':d>0?'You score '+d+' points higher on past-paper questions than on AI predictions. That can mean you remember those questions rather than the method, so spend time on predictions.':'You score '+(-d)+' points higher on predictions than on past-paper questions.';}
  else cmp='Answer at least 5 of each kind to compare them.';
  h+='<div class="grid g2"><div class="card sec"><h3>Past papers vs AI predictions</h3>'+bars([{label:'Past-paper questions',ok:po.ok,n:po.n}])+bars([{label:'AI predictions',ok:pp.ok,n:pp.n}],'pr')+'<p class="small muted">'+cmp+'</p></div>';
  const bp=agg(q=>q.codes);
  h+='<div class="card sec"><h3>Accuracy by examination paper</h3>'+bars(CODE_ORDER.map(c=>({label:paperName(c)+' · '+PAPERS[c].year,ok:(bp[c]||{}).ok||0,n:(bp[c]||{}).n||0})))+'<p class="small muted">A question that appears on several papers counts towards each.</p></div></div>';
  // trend
  h+='<div class="card sec"><h3>Improvement over time</h3>'+trend(att)+'</div>';
  // weak topics
  const sub=agg(q=>[q.topic+'||'+q.subtopic]);
  const weak=Object.entries(sub).filter(([k,v])=>v.n>=3).map(([k,v])=>({k,p:pct(v.ok,v.n),n:v.n,ok:v.ok})).filter(x=>x.p<70).sort((a,b)=>a.p-b.p).slice(0,5);
  const weakT=trows.filter(r=>r.n>=5&&pct(r.ok,r.n)<70).sort((a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n));
  h+='<div class="card sec"><h3>What to revise first</h3>';
  if(weakT.length||weak.length){
    h+='<ul class="ul">'+weakT.map(r=>'<li><b>'+esc(r.label)+'</b> is at '+pct(r.ok,r.n)+'% over '+r.n+' attempts. Prioritise this topic.</li>').join('')+weak.map(w=>'<li>Subtopic <b>'+esc(w.k.split('||')[1])+'</b> ('+esc(sh(w.k.split('||')[0]))+'): '+w.p+'% over '+w.n+' attempts.</li>').join('')+'</ul>';
  }else h+='<p class="muted">Nothing is clearly weak yet. Recommendations appear once a subtopic has at least 3 attempts below 70%, so keep practising across all topics.</p>';
  h+='<div class="row"><button type="button" class="btn" data-act="gowrong">Practise incorrect answers ('+mi.length+')</button></div></div>';
  h+='<div class="card sec"><h3>Incorrect answers</h3><p>Questions you have ever missed: <b>'+rc.ever+'</b>. Now answered correctly: <b>'+rc.rec+'</b>. Still wrong: <b>'+mi.length+'</b>.</p><div class="bar"><i style="width:'+pct(rc.rec,rc.ever)+'%"></i></div></div>';
  return h;
}
function trend(att){
  if(att.length<5)return '<p class="muted">Answer at least 5 questions to see a trend. The line shows accuracy over your most recent 10 attempts.</p>';
  const pts=[];let w=[];att.forEach((a,i)=>{w.push(a.ok?1:0);if(w.length>10)w.shift();pts.push(w.reduce((x,y)=>x+y,0)/w.length*100)});
  const W=600,H=170,L=34,R=10,T=10,B=24,n=pts.length;
  const x=i=>L+(n===1?0:i/(n-1)*(W-L-R)),y=v=>T+(1-v/100)*(H-T-B);
  let d=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Rolling accuracy over '+n+' attempts" style="max-width:100%">';
  [0,50,100].forEach(v=>s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text>');
  s+='<path d="'+d+' L'+x(n-1)+' '+y(0)+' L'+x(0)+' '+y(0)+'Z" fill="var(--accent)" opacity=".1"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="'+x(n-1)+'" cy="'+y(pts[n-1])+'" r="4" fill="var(--accent)"/>';
  s+='<text x="'+L+'" y="'+(H-6)+'">attempt 1</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">attempt '+n+'</text></svg>';
  return s+'<p class="small muted">Latest: '+Math.round(pts[n-1])+'% over the last '+Math.min(10,n)+' attempts.</p>';
}

/* ---------- analysis ---------- */
function viewAnalysis(){
  const mt=['MT20','MT22','MT23','MT25'],fin=['S22','F22','F23','F25'];
  const mat=AN.mat,col=c=>c;
  const sum=(t,cs)=>cs.reduce((a,c)=>a+mat[t][c],0);
  const totM=TOPICS.map(t=>sum(t,mt)),totF=TOPICS.map(t=>sum(t,fin));
  const mAll=totM.reduce((a,b)=>a+b,0),fAll=totF.reduce((a,b)=>a+b,0);
  const money=TOPICS.find(t=>t.startsWith('Money')),mm=sum(money,mt),mf=sum(money,fin);
  const kt=TOPICS.find(t=>t.startsWith('Keynesian')),kM=sum(kt,mt),kF=sum(kt,fin);
  const rec=TOPICS.find(t=>t.startsWith('Recessions'));
  let h='<div class="sec"><h2>Exam analysis</h2><p class="muted">Built from the '+PAST.length+' authentic questions in this bank. Only questions inside the midterm syllabus (Weeks 1–6) were collected, so some papers contribute fewer questions than their full length. Counts are per recorded source, so a question that appears on two papers counts on both.</p></div>';
  // matrix
  h+='<div class="card sec"><h3>Questions per topic, per paper</h3><div class="scroll"><table class="heat"><tr><th>Topic</th>'+AN.codes.map(c=>'<th title="'+esc(paperName(c)+' '+PAPERS[c].year)+'">'+c+'</th>').join('')+'<th>Midterms</th><th>Finals</th></tr>';
  TOPICS.forEach((t,i)=>{h+='<tr><td>'+esc(sh(t))+'</td>'+AN.codes.map(c=>{const v=mat[t][c];return '<td class="'+(v===0?'z':v>=7?'h3':v>=4?'h2':'h1')+'">'+v+'</td>'}).join('')+'<td><b>'+totM[i]+'</b></td><td><b>'+totF[i]+'</b></td></tr>'});
  h+='</table></div><p class="small muted">MT = midterm, S/F = final. '+AN.codes.map(c=>c+' = '+paperName(c)+', '+PAPERS[c].year).join('; ')+'. MT20 and S22 are from the sister course ECON10020. A zero means no question in this bank, not proof the paper had none.</p></div>';
  // findings
  h+='<div class="card sec"><h3>What the papers show</h3><ul class="ul">';
  h+='<li><b>GDP and prices are on every midterm.</b> Together they make up '+Math.round((sum(TOPICS[0],mt)+sum(TOPICS[1],mt))/mAll*100)+'% of the '+mAll+' midterm questions collected. They appear on all four midterms, and MT22, MT23 and MT25 each have 6 to 7 of each.</li>';
  h+='<li><b>The Keynesian cross is the most consistent finals topic and the growing midterm topic.</b> It has '+kF+' finals questions against '+kM+' on midterms. On midterms it is 0 on MT22, 1 on MT23 and 3 on MT25, so weight on it is rising in the most recent midterm.</li>';
  h+='<li><b>Money and banking has barely been examined on a midterm.</b> '+mm+' midterm question in total (on the sister course ECON10020, MT20) against '+mf+' on finals. It is taught in Weeks 5 to 6, which this midterm covers, so the evidence says it is unlikely but does not say it is impossible.</li>';
  h+='<li><b>Recessions, gaps and unemployment</b> is thinly covered on midterms ('+sum(rec,mt)+' questions) and mostly appears through the Keynesian assumption (MT23 Q14 and MT20 Q11 repeat it).</li></ul></div>';
  h+='<div class="card sec"><h3>Recurring question structures</h3><ul class="ul">';
  h+='<li><b>Compute GDP or investment from a list of items.</b> The same list with new numbers appears on MT23 Q2 and MT25 Q11 (inventory change, transfers excluded, existing homes excluded, imports subtracted).</li>';
  h+='<li><b>EXCEPT questions on real versus nominal quantities</b> appear on MT25 Q7, MT23 Q10 and F23 Q29.</li>';
  h+='<li><b>CPI from a basket</b> using base-year quantities appears on MT22 Q8 and MT25 Q8.</li>';
  h+='<li><b>Inflation rate from two CPI values</b> and <b>r ≈ i − π</b> appear across MT23, F22, F23 and F25.</li>';
  h+='<li><b>Short-run equilibrium output</b> from PAE = a + bY, and the output gap Y* − Y, appear on MT25 Q12 and Q15 and on three finals.</li>';
  h+='<li><b>Questions repeated word for word across midterms:</b> '+(AN.repmt.length?AN.repmt.map(r=>'“'+esc(r.stem.slice(0,70))+'…” ('+r.codes.join(', ')+')').join('; '):'none recorded')+'.</li></ul></div>';
  // gaps
  const subs={};PAST.forEach(q=>{subs[q.topic+'||'+q.subtopic]=subs[q.topic+'||'+q.subtopic]||{p:0,a:0};subs[q.topic+'||'+q.subtopic].p++});PRED.forEach(q=>{subs[q.topic+'||'+q.subtopic]=subs[q.topic+'||'+q.subtopic]||{p:0,a:0};subs[q.topic+'||'+q.subtopic].a++});
  h+='<div class="card sec"><h3>Gaps and how the predictions respond</h3><ul class="ul">';
  h+='<li><b>Money and banking has a gap between syllabus and midterm history.</b> It is lectured in Weeks 5 to 6 and is on every final, so '+PRED.filter(q=>q.topic===money).length+' of the '+PRED.length+' predictions test it. Confidence is capped at Medium or High only where a finals question has the same structure, because no midterm shows it.</li>';
  h+='<li><b>Questions that change direction.</b> Several predictions reverse a tested relationship (solve for i instead of r, required ratio above desired ratio, real GDP after nominal GDP). These are Medium confidence because the reversal itself has no precedent.</li>';
  h+='<li><b>Lecture-only material.</b> Bank runs and seigniorage come from the slides and notes, with no past question. Those two are marked Low.</li>';
  h+='<li><b>Limits of this analysis.</b> Four midterms and four finals is a small sample. Source tags come from the compiled answer key, so a question may also have appeared on a paper not recorded here. Nothing here predicts the actual paper.</li></ul></div>';
  h+='<div class="card sec"><h3>Prediction coverage by subtopic</h3><div class="scroll"><table class="heat"><tr><th>Subtopic</th><th>Past-paper questions</th><th>AI predictions</th></tr>';
  TOPICS.forEach(t=>{Object.keys(subs).filter(k=>k.split('||')[0]===t).forEach(k=>{const v=subs[k];h+='<tr><td>'+esc(k.split('||')[1])+' <span class="muted small">('+esc(sh(t))+')</span></td><td>'+v.p+'</td><td class="'+(v.a===0?'z':'')+'">'+v.a+'</td></tr>'})});
  h+='</table></div><p class="small muted">Subtopics with a 0 for predictions already have many authentic questions, or were judged too well covered by them to predict anything new.</p></div>';
  // data quality
  const off=PAST.filter(q=>q.verified==='official').length,fl=PAST.filter(q=>q.flag).length;
  h+='<div class="card sec"><h3>Answer reliability</h3><ul class="ul"><li><b>'+off+'</b> authentic answers come from an official key (MT25, F23, F25). <b>'+(PAST.length-off)+'</b> were worked out for this pack because no key was found (MT22, MT23, MT20, S22, F22).</li><li><b>'+fl+'</b> questions carry a review note, shown after you answer. Four were restated from a diagram into an equation, so their wording is adapted.</li><li>Authentic questions keep their original 4 or 5 options. '+PAST.filter(q=>q.opts.length===5).length+' have five (A to E).</li><li>All '+PRED.length+' predictions have exactly four options and every number was checked by calculation.</li></ul></div>';
  return h;
}

/* ---------- main render + events ---------- */
function render(){
  setNav();
  const m=$('#main');
  m.innerHTML=view==='home'?viewHome():view==='quiz'?viewQuiz():view==='bank'?viewBank():view==='dash'?viewDash():viewAnalysis();
  if(view==='quiz')window.scrollTo({top:0});
}
function go(v){view=v;if(v!=='quiz'&&quiz&&!quiz.finished&&quiz.exam){/* keep */}render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{
  const nb=e.target.closest('#nav [data-view]');if(nb){if(quiz&&quiz.exam&&!quiz.finished&&view==='quiz'){}view=nb.dataset.view;if(view==='home')quiz=quiz&&quiz.finished?null:quiz;render();return}
  if(e.target.id==='theme'){const r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,z=quiz,id=b.dataset.id;
  if(a==='mode'){readCfg();mode=b.dataset.m;render()}
  else if(a==='start'){startQuiz()}
  else if(a==='pick'&&z&&!z.finished){const cur=z.ids[z.i];if(!z.exam&&z.done[cur])return;z.sel[cur]=b.dataset.k;render()}
  else if(a==='submit'){const cur=z.ids[z.i];if(!z.sel[cur]||z.done[cur])return;z.done[cur]=true;record(cur,z.sel[cur],z.mode);render()}
  else if(a==='next'){if(z.i<z.ids.length-1){z.i++}else if(!z.exam){z.finished=true}render()}
  else if(a==='prev'){if(z.i>0)z.i--;render()}
  else if(a==='go'){z.i=+b.dataset.i;render()}
  else if(a==='finish'){const un=z.ids.length-Object.keys(z.sel).length;if(un>0&&!z.confirm){z.confirm=true;render()}else finishExam()}
  else if(a==='cancelconf'){z.confirm=false;render()}
  else if(a==='quit'){if(z.exam){clearInterval(tmr);quiz=null;view='home'}else{z.finished=true}render()}
  else if(a==='home'){quiz=null;view='home';render()}
  else if(a==='retrywrong'){const ids=z.ids.filter(i=>z.sel[i]!==BY[i].ans);mode='wrong';launch(shuffle(ids),'Retry missed questions',false,0,'wrong')}
  else if(a==='bm'){S.bm[id]?delete S.bm[id]:S.bm[id]=1;save();render()}
  else if(a==='fl'){S.fl[id]?delete S.fl[id]:S.fl[id]=1;save();render()}
  else if(a==='bopen'){bankOpen[id]?delete bankOpen[id]:bankOpen[id]=true;render()}
  else if(a==='bans'){bankOpen[id]=bankOpen[id]==='ans'?true:'ans';render()}
  else if(a==='retry1'){launch([id],'Single question',false,0,'retry')}
  else if(a==='clearf'){Object.keys(F).forEach(k=>F[k]='');bankPage=1;render()}
  else if(a==='practf'){const l=shuffle(bankList()).map(q=>q.id);launch(l,'Practice from question bank ('+l.length+')',false,0,'bank')}
  else if(a==='pg'){bankPage+=+b.dataset.d;render();window.scrollTo({top:0})}
  else if(a==='reset1'){confirmReset=true;render()}
  else if(a==='reset0'){confirmReset=false;render()}
  else if(a==='reset2'){S.att=[];S.bm={};S.fl={};save();confirmReset=false;render()}
  else if(a==='gowrong'){mode='wrong';view='home';render()}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id&&t.id.startsWith('f-')){F[t.id.slice(2)]=t.value;bankPage=1;render()}
});
let st=null;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='f-q'){F.q=t.value;bankPage=1;clearTimeout(st);st=setTimeout(()=>{render();const i=$('#f-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},200)}});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!quiz||quiz.finished)return;
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT')return;
  const q=BY[quiz.ids[quiz.i]],k=e.key.toUpperCase();
  if(q.opts.some(o=>o[0]===k)&&(quiz.exam||!quiz.done[q.id])){quiz.sel[q.id]=k;render()}
});
render();
})();
</script>
