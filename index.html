xam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":13}],"verified":"official","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P084","n":84,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Suppose that C = 100 + 0.9Y, I = 100, G = 200, Exports = 50, Imports = 50 + 0.1Y. So we have a standard Keynesian model except that imports increase when we get richer (we buy more imported goods). In this model the multiplier is:","table":null,"opts":[["A","1"],["B","2.5"],["C","5"],["D","10"],["E","20"]],"ans":"C","expl":"PAE = 100 + 0.9Y + 100 + 200 + 50 − 50 − 0.1Y = 400 + 0.8Y. Multiplier = 1 / (1 − 0.8) = 5. The marginal propensity to import lowers it from 10.","ansnote":"5","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":14}],"verified":"worked","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P085","n":85,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Consider a Keynesian cross model where firms invest more when their customers are richer, so investment increases with income: Y = C + I + G + Nx; C = C̄ + cY where C̄ > 0 and 0 < c < 1; I = Ī + zY where Ī > 0 and 1 − c > z > 0; G and Nx do not depend on income. What is the government spending multiplier in this model?","table":null,"opts":[["A","1/(1 − c)"],["B","1/(1 − cz)"],["C","1/(1 − c + z)"],["D","1/(1 − c − z)"],["E","z/(1 − c)"]],"ans":"D","expl":"Y = (C̄ + Ī + G + Nx) + (c + z)Y, so Y = A / (1 − c − z). The multiplier is 1/(1 − c − z).","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":30}],"verified":"official","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P086","n":86,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"All of the below will increase the government spending multiplier EXCEPT:","table":null,"opts":[["A","easier access to foreign goods"],["B","lower income taxes"],["C","lower sales taxes (taxes on consumer purchases such as VAT)"],["D","increased marginal propensity to consume"],["E","all the other answers will increase the multiplier"]],"ans":"A","expl":"easier access to foreign goods raises imports out of income, which lowers the multiplier. Lower taxes and a higher MPC raise it.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":9}],"verified":"official","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"EXCEPT","diff":"Easy"},{"id":"P087","n":87,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Fiscal policy refers to decisions about:","table":null,"opts":[["A","money supply."],["B","military spending."],["C","healthcare spending."],["D","the government's budget."],["E","none of the above"]],"ans":"D","expl":"fiscal policy is the government's budget (taxes and spending).","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":12}],"verified":"official","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P088","n":88,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"In the short-run Keynesian model, to close a recessionary gap of €1 billion, government purchases must be:","table":null,"opts":[["A","increased by €1 billion."],["B","decreased by €1 billion."],["C","increased by more than €1 billion."],["D","increased by less than €1 billion."]],"ans":"D","expl":"the multiplier is above 1, so ΔG = gap × (1 − c), which is less than the gap.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":19}],"verified":"official","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P089","n":89,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"A fiscal policy action to close a recessionary gap is to:","table":null,"opts":[["A","increase taxes."],["B","increase transfer payments."],["C","decrease government purchases."],["D","decrease the marginal propensity to consume."]],"ans":"B","expl":"raising transfers raises disposable income and spending. The other options are contractionary.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":20}],"verified":"official","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P090","n":90,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Automatic stabilizers are provisions in the law that create automatic ______ in government spending or ______ in taxes when real output declines.","table":null,"opts":[["A","increases; increases"],["B","increases; decreases"],["C","no change; no change"],["D","decreases; decreases"]],"ans":"B","expl":"when output declines, spending rises (e.g. unemployment benefits) and taxes fall automatically.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":21}],"verified":"official","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P091","n":91,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"If consumption increases by €9 when after-tax disposable income increases by €10, the marginal propensity to consume equals:","table":null,"opts":[["A","0.1"],["B","0.9"],["C","1.0"],["D","9.0"],["E","10.0"]],"ans":"B","expl":"MPC = ΔC / Δ(Y − T) = 9 / 10 = 0.9.","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":12}],"verified":"worked","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P092","n":92,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Consider the following Keynesian model where, in addition to consumption depending on income, investment depends on Y as well. In the short run the economy is described by: C = 100 + 0.8Y; I = 30 + 0.1Y; G = 50; Nx = 10. What is the multiplier in this economy?","table":null,"opts":[["A","0.1/0.2 = 0.5"],["B","0.8/0.9 = 0.89"],["C","1/0.7 = 1.4"],["D","1/0.2 = 5"],["E","1/0.1 = 10"]],"ans":"E","expl":"PAE = 100 + 0.8Y + 30 + 0.1Y + 50 + 10 = 190 + 0.9Y. The slope is 0.9, so the multiplier is 1/(1 − 0.9) = 10. When investment rises with income, the slope becomes c + z (0.8 + 0.1) and the multiplier rises from 5 to 10.","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":1}],"verified":"worked","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P093","n":93,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Suppose that Irish people start to like foreign goods more, so a higher percentage of their spending is on foreign goods. If nothing else changes, this will:","table":null,"opts":[["A","make the multiplier go down"],["B","make the multiplier go up"],["C","not change the multiplier"],["D","increase GDP"],["E","not change the multiplier or GDP"]],"ans":"A","expl":"a higher share of spending on foreign goods means more leaks abroad each round, so less is re-spent at home, the PAE line is flatter and the multiplier falls. GDP would not rise (D).","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":2}],"verified":"worked","flag":null,"sub":"K4","subtopic":"Multipliers","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P094","n":94,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Changes in taxes and transfers affect planned spending:","table":null,"opts":[["A","only when there is an expansionary gap."],["B","autonomously."],["C","directly."],["D","by changing disposable income and, consequently, consumption."],["E","by changing government purchases."]],"ans":"D","expl":"government purchases enter PAE directly, but taxes and transfers work indirectly: they change disposable income (Y − T), and consumption changes by c times that change.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":10}],"verified":"worked","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P095","n":95,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"To close an expansionary gap, the government could ______.","table":null,"opts":[["A","decrease the money supply."],["B","increase the money supply."],["C","increase its spending."],["D","decrease its spending."],["E","do nothing."]],"ans":"D","expl":"an expansionary gap (Y > Y*) needs contractionary policy, so the government cuts spending (or raises taxes). Changing the money supply is the central bank's tool, not the government's.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":11}],"verified":"worked","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P096","n":96,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"Citizens having to pay a certain fraction of their income in taxes is a(n) _______.","table":null,"opts":[["A","discretionary fiscal policy."],["B","bad thing in terms of economic efficiency."],["C","automatic stabiliser."],["D","factor that contributes to expansionary gaps."],["E","factor that contributes to recessionary gaps."]],"ans":"C","expl":"a tax that is a fraction of income falls automatically when income falls, cushioning spending without any new decision. That is an automatic stabiliser.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":12}],"verified":"worked","flag":null,"sub":"K2","subtopic":"Planned expenditure and the Keynesian cross","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P097","n":97,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"If potential output equals 3,000 and short-run equilibrium output equals 3,500, there is a(n) ______ gap and to close the gap the European Central Bank could try to _____ real interest rates.","table":null,"opts":[["A","recessionary; raise"],["B","expansionary; raise"],["C","recessionary; lower"],["D","expansionary; lower"],["E","recessionary; not change"]],"ans":"B","expl":"Y = 3,500 > Y* = 3,000, so there is an expansionary gap. To close it, contractionary policy: raise real interest rates, which cuts investment and spending.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":13}],"verified":"worked","flag":null,"sub":"K3","subtopic":"Equilibrium output","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P098","n":98,"kind":"past","topic":"Keynesian cross, multipliers and stabilization policy","stem":"To eliminate a recessionary gap, the European Central Bank _____ the nominal interest rate, _____ the real interest rate, and ____ the money supply.","table":null,"opts":[["A","increases; increases; increases"],["B","decreases; decreases; decreases"],["C","increases; increases; decreases"],["D","decreases; decreases; increases"],["E","increases; decreases; decreases"]],"ans":"D","expl":"a recessionary gap needs expansionary policy. The ECB increases the money supply, which lowers the nominal interest rate and (with inflation fixed in the short run) the real rate, raising investment, PAE and output.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":14}],"verified":"worked","flag":null,"sub":"K5","subtopic":"Fiscal and monetary stabilization","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P099","n":99,"kind":"past","topic":"Money, banks and the central bank","stem":"The main disadvantage of using money as a store of value is that:","table":null,"opts":[["A","other assets provide greater anonymity than cash."],["B","barter is a more efficient way to conduct transactions than using money."],["C","unlike other assets, money serves as a medium of exchange."],["D","other assets pay relatively higher rates of interest than money."]],"ans":"D","expl":"other assets pay higher interest than money, so money is a weak store of value.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":1}],"verified":"official","flag":null,"sub":"M1","subtopic":"Functions and measures of money","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P100","n":100,"kind":"past","topic":"Money, banks and the central bank","stem":"Money serves as a basic yardstick for measuring economic value (a unit of account), allowing:","table":null,"opts":[["A","people to hold their wealth in a liquid form."],["B","governments to restrict the issuance of private monies."],["C","easy comparison of the relative prices of goods and services."],["D","goods and services to be exchanged with a double coincidence of wants."]],"ans":"C","expl":"a common unit lets you compare relative prices.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":2}],"verified":"official","flag":null,"sub":"M1","subtopic":"Functions and measures of money","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P101","n":101,"kind":"past","topic":"Money, banks and the central bank","stem":"In the Planet Money podcast \"Four Drinking Buddies\" which function of money did the new Brazilian currency initially focus on in order to control hyper-inflation?","table":null,"opts":[["A","medium of exchange"],["B","store of value"],["C","unit of account"],["D","double coincidence of wants"],["E","standard of deferred payment"]],"ans":"C","expl":"unit of account.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":28}],"verified":"official","flag":null,"sub":"M1","subtopic":"Functions and measures of money","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P102","n":102,"kind":"past","topic":"Money, banks and the central bank","stem":"The components of M2 that are not also in M1:","table":null,"opts":[["A","sum to an amount that is smaller than the sum of the components of M1."],["B","pay lower rates of interest than do the components of M1."],["C","are not usable for making payments."],["D","are usable for making payments, but generally at a greater cost or inconvenience than currency or checkable deposits."]],"ans":"D","expl":"M2's extra components can be spent, but less easily than cash or checking deposits.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":3}],"verified":"official","flag":null,"sub":"M1","subtopic":"Functions and measures of money","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P103","n":103,"kind":"past","topic":"Money, banks and the central bank","stem":"Banks hold reserves:","table":null,"opts":[["A","to earn interest."],["B","to increase profits."],["C","only because the government requires them to hold reserves."],["D","to meet depositor withdrawals and payments."]],"ans":"D","expl":"reserves are held to meet withdrawals and payments.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":4}],"verified":"official","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P104","n":104,"kind":"past","topic":"Money, banks and the central bank","stem":"Bank reserves are:","table":null,"opts":[["A","currency and customer checking deposits."],["B","currency, customer checking and savings deposits."],["C","any asset used to purchase goods and services."],["D","financial assets obtained from savers and lent to borrowers."],["E","cash and similar assets held to meet depositor withdrawals or payments."]],"ans":"E","expl":"cash and similar assets held to meet withdrawals or payments.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":16}],"verified":"worked","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P105","n":105,"kind":"past","topic":"Money, banks and the central bank","stem":"When an individual deposits currency into a checking account:","table":null,"opts":[["A","bank reserves increase, which allows banks to lend more and increases the money supply."],["B","bank reserves decrease, which reduces the amount banks can lend and reduces the growth of the money supply."],["C","bank reserves are unchanged."],["D","bank liabilities increase, which reduces the amount banks can lend and reduces the growth of the money supply."]],"ans":"A","expl":"a cash deposit raises reserves, so banks can lend more and the money supply grows.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":5}],"verified":"official","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P106","n":106,"kind":"past","topic":"Money, banks and the central bank","stem":"If a bank's desired reserve-deposit ratio is 0.33 and it has deposit liabilities of $100 million and reserves of $50 million, it:","table":null,"opts":[["A","has too few reserves and will reduce its lending."],["B","has too many reserves and will increase its lending."],["C","has the correct amount of reserves and outstanding loans."],["D","should increase the amount of its reserves."]],"ans":"B","expl":"actual ratio = 50/100 = 0.50, above the desired 0.33, so excess reserves and more lending.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":7}],"verified":"official","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P107","n":107,"kind":"past","topic":"Money, banks and the central bank","stem":"There is €10,000,000 in currency. The public holds half of the currency and banks hold the rest as reserves. If banks' desired reserve/deposit ratio is 10 percent, deposits equal ______ and the money supply equals _______.","table":null,"opts":[["A","€50,000,000; €60,000,000"],["B","€55,000,000; €55,000,000"],["C","€50,000,000; €55,000,000"],["D","€10,000,000; €100,000,000"]],"ans":"C","expl":"banks hold 5m in reserves. Deposits = 5m / 0.10 = 50m. Money supply = 50m + 5m held by the public = 55m. (The F22 version also gives a 5% required ratio, which is irrelevant because banks desire 10%.)","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":6},{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":17}],"verified":"official","flag":null,"sub":"M3","subtopic":"Money supply and the multiplier","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P108","n":108,"kind":"past","topic":"Money, banks and the central bank","stem":"If bank reserves are 200, the public holds 400 in currency, the required reserve/deposit ratio is 0.10 and the desired reserve/deposit ratio is 0.25, then bank deposits are ____ and the money supply is _____.","table":null,"opts":[["A","200; 600"],["B","400; 800"],["C","600; 1,000"],["D","800; 1,200"],["E","2,400; 2,800"]],"ans":"D","expl":"banks hold the larger desired ratio, so deposits = 200 / 0.25 = 800. Money supply = 800 + 400 = 1,200.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":2}],"verified":"official","flag":null,"sub":"M3","subtopic":"Money supply and the multiplier","paperlabels":null,"type":"Calculation","diff":"Medium"},{"id":"P109","n":109,"kind":"past","topic":"Money, banks and the central bank","stem":"The amount of money in the Eurosystem is determined by:","table":null,"opts":[["A","the European Central Bank."],["B","commercial banks."],["C","the public."],["D","the combined behaviour of commercial banks and the public."],["E","the combined behaviour of commercial banks and the public, and actions of the European Central Bank."]],"ans":"E","expl":"the ECB, commercial banks and the public all matter.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":15}],"verified":"worked","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P110","n":110,"kind":"past","topic":"Money, banks and the central bank","stem":"The European Central Bank is:","table":null,"opts":[["A","a group of eleven commercial banks."],["B","the central bank of the Eurosystem."],["C","the agency of the E.U. Parliament that insures commercial bank deposits."],["D","a firm that accepts deposits from the nonbank public and lends them to borrowers."],["E","the branch of the German Treasury that keeps the German gold reserves."]],"ans":"B","expl":"the ECB is the central bank of the Eurosystem.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":18}],"verified":"worked","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P111","n":111,"kind":"past","topic":"Money, banks and the central bank","stem":"The most important, most convenient, and most flexible way in which the European Central Bank (ECB) affects the supply of bank reserves is through:","table":null,"opts":[["A","conducting open-market operations."],["B","changing the ECB main refinancing rate."],["C","changing bank reserve requirement ratios."],["D","changing interest rates."],["E","conducting bank examinations."]],"ans":"A","expl":"open-market operations.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":1}],"verified":"official","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P112","n":112,"kind":"past","topic":"Money, banks and the central bank","stem":"In an open-market sale the central bank _____ government bonds and the supply of bank reserves ______.","table":null,"opts":[["A","buys; increases"],["B","sells; does not change"],["C","buys; decreases"],["D","sells; decreases"],["E","sells; increases"]],"ans":"D","expl":"selling bonds takes reserves out of the system, so reserves fall.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":19}],"verified":"worked","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P113","n":113,"kind":"past","topic":"Money, banks and the central bank","stem":"In an open-market purchase the central bank ______ government bonds from the public and the supply of bank reserves ______.","table":null,"opts":[["A","buys; increases"],["B","buys; decreases"],["C","sells; decreases"],["D","sells; increases"]],"ans":"A","expl":"buying bonds puts reserves in, so reserves rise.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":8}],"verified":"official","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P114","n":114,"kind":"past","topic":"Money, banks and the central bank","stem":"The money supply in Macroland is currently 3,000, bank reserves are 500, currency held by the public is 500, and banks' desired reserve/deposit ratio is 0.20. Assuming the values of the currency held by the public and the desired reserve/deposit ratio do not change, if the Central Bank of Macroland wishes to reduce the money supply to 2,500, it should conduct an open-market ______ government bonds to/from the public.","table":null,"opts":[["A","purchase of 100"],["B","sale of 100"],["C","purchase of 250"],["D","sale of 500"],["E","purchase of 500"]],"ans":"B","expl":"M of 2,500 with 500 currency means deposits of 2,000. Reserves needed = 0.20 × 2,000 = 400, which is 100 less than now. An open-market sale of 100 drains 100 of reserves. (The original paper said \"increase\" by mistake; the target of 2,500 is a reduction from 3,000.)","ansnote":"sale of 100","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":20}],"verified":"worked","flag":null,"sub":"M3","subtopic":"Money supply and the multiplier","paperlabels":null,"type":"Calculation","diff":"Hard"},{"id":"P115","n":115,"kind":"past","topic":"Money, banks and the central bank","stem":"The money supply in Macroland is currently 3,000, bank reserves are 250, currency held by the public is 500, the required reserve/deposit ratio is 0.10 and banks' desired reserve/deposit ratio is 0.10. Assuming the values of the currency held by the public and the desired reserve/deposit ratio do not change, if the Central Bank of Macroland wishes to decrease the money supply to 2,500, it should conduct an open-market ____ government bonds to/from the public.","table":null,"opts":[["A","purchase of 50"],["B","sale of 50"],["C","purchase of 250"],["D","sale of 500"],["E","purchase of 500"]],"ans":"B","expl":"M of 2,500 with 500 currency means deposits of 2,000. Reserves needed = 0.10 × 2,000 = 200, which is 50 less than now. So sell 50.","ansnote":"sale of 50","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":3}],"verified":"official","flag":null,"sub":"M3","subtopic":"Money supply and the multiplier","paperlabels":null,"type":"Calculation","diff":"Hard"},{"id":"P116","n":116,"kind":"past","topic":"Money, banks and the central bank","stem":"Higher nominal interest rates ______ the demand for money and a higher price level _____ the demand for money.","table":null,"opts":[["A","increase; increases"],["B","decrease; decreases"],["C","increase; decreases"],["D","decrease; increases"],["E","increase; does not change"]],"ans":"D","expl":"a higher nominal interest rate (the opportunity cost of holding money) lowers money demand. A higher price level raises it.","ansnote":"","sources":[{"code":"F22","paper":"Final exam","session":"2022/23 Autumn","course":"ECON10760","year":"2022/23","q":21}],"verified":"worked","flag":null,"sub":"M5","subtopic":"Money demand and the interest rate","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P117","n":117,"kind":"past","topic":"Money, banks and the central bank","stem":"Higher real income ____ the demand for money and a higher price level ___ the demand for money.","table":null,"opts":[["A","increases; increases"],["B","decreases; decreases"],["C","increases; decreases"],["D","decreases; increases"],["E","increases; does not change"]],"ans":"A","expl":"higher real income and a higher price level both raise money demand (shift it right).","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":5}],"verified":"official","flag":null,"sub":"M5","subtopic":"Money demand and the interest rate","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P118","n":118,"kind":"past","topic":"Money, banks and the central bank","stem":"Any value of the money supply chosen by the central bank implies a specific value for ______.","table":null,"opts":[["A","potential output"],["B","the budget deficit"],["C","net exports"],["D","the nominal interest rate"],["E","government purchases"]],"ans":"D","expl":"the money supply and money demand together fix the nominal interest rate.","ansnote":"","sources":[{"code":"F25","paper":"Final exam","session":"2025/26 Autumn","course":"ECON10760","year":"2025/26","q":4}],"verified":"official","flag":null,"sub":"M5","subtopic":"Money demand and the interest rate","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P119","n":119,"kind":"past","topic":"Money, banks and the central bank","stem":"In the past, some governments' budget deficits became so large that they could not raise sufficient taxes to finance the spending, so they ______, which led to ______.","table":null,"opts":[["A","reduced the amount of currency held by the public; a smaller money supply"],["B","increased bank reserves; a larger reserve/deposit ratio"],["C","printed large quantities of paper money; hyperinflation"],["D","ordered the central bank to sell government bonds; an increase in the money supply"]],"ans":"C","expl":"printing money to cover deficits (seigniorage) leads to hyperinflation.","ansnote":"","sources":[{"code":"F23","paper":"Final exam","session":"2023/24 Autumn","course":"ECON10760","year":"2023/24","q":9}],"verified":"official","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Fill-in-the-blank","diff":"Easy"},{"id":"P120","n":120,"kind":"past","topic":"Money, banks and the central bank","stem":"When money is the basic measure of economic value, it serves as a:","table":null,"opts":[["A","financial intermediary."],["B","medium of exchange."],["C","double coincidence of wants."],["D","unit of account."],["E","store of value."]],"ans":"D","expl":"a basic measure of economic value is the unit of account function.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":1}],"verified":"worked","flag":null,"sub":"M1","subtopic":"Functions and measures of money","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P121","n":121,"kind":"past","topic":"Money, banks and the central bank","stem":"Double coincidence of wants is avoided if money is used as a:","table":null,"opts":[["A","medium of exchange."],["B","store of value."],["C","measure of value."],["D","tool of monetary policy."],["E","standard of deferred payment."]],"ans":"A","expl":"money as a medium of exchange removes the need for a double coincidence of wants that barter requires.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":6}],"verified":"worked","flag":null,"sub":"M1","subtopic":"Functions and measures of money","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P122","n":122,"kind":"past","topic":"Money, banks and the central bank","stem":"If the reserve/deposit ratio is less than 100%, then the banking system engages in:","table":null,"opts":[["A","capital investment."],["B","100% reserve banking."],["C","credit allocation."],["D","fractional-reserve banking."],["E","the double coincidence of wants."]],"ans":"D","expl":"if banks keep only a fraction of deposits as reserves and lend the rest, that is fractional-reserve banking. 100% reserve banking means the ratio equals 100%.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":2}],"verified":"worked","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P123","n":123,"kind":"past","topic":"Money, banks and the central bank","stem":"If the actual reserve/deposit ratio equals 8% and the desired reserve/deposit ratio for this bank is 10%, the bank should:","table":null,"opts":[["A","do nothing because this is a profitable situation."],["B","stop making loans."],["C","send the extra reserves to the central bank."],["D","request that customers withdraw deposits from the bank."],["E","make more loans in order to earn interest."]],"ans":"B","expl":"an actual ratio of 8% is below the desired 10%, so the bank has too few reserves. It should stop lending until reserves are rebuilt. E (make more loans) is the answer for the opposite case of excess reserves.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":3}],"verified":"worked","flag":null,"sub":"M2","subtopic":"Banks and reserves","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P124","n":124,"kind":"past","topic":"Money, banks and the central bank","stem":"When the European Central Bank sells government bonds to the public, this is an example of a(n):","table":null,"opts":[["A","bank panic."],["B","discount loan."],["C","open-market sale."],["D","change in reserve requirements."],["E","open-market purchase."]],"ans":"C","expl":"the central bank selling government bonds is an open-market sale. It takes reserves out of the banking system and reduces the money supply.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":5}],"verified":"worked","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P125","n":125,"kind":"past","topic":"Money, banks and the central bank","stem":"Because a decrease in the nominal interest rate reduces the opportunity cost of holding money, the money demand curve:","table":null,"opts":[["A","shifts to the right."],["B","slopes downward."],["C","shifts to the left."],["D","slopes upward."],["E","is vertical."]],"ans":"B","expl":"a lower nominal rate means a lower opportunity cost of holding money, so people hold more: the demand curve slopes downward. A change in the interest rate is a movement along the curve; shifts come from changes in income or the price level.","ansnote":"","sources":[{"code":"S22","paper":"Final exam","session":"2022/23 Spring","course":"ECON10020","year":"2022/23","q":8}],"verified":"worked","flag":null,"sub":"M5","subtopic":"Money demand and the interest rate","paperlabels":null,"type":"Concept","diff":"Easy"},{"id":"P126","n":126,"kind":"past","topic":"Money, banks and the central bank","stem":"The Bretton Woods Agreement:","table":null,"opts":[["A","was in response to the United States leaving the gold standard."],["B","resulted in hyperinflation in Germany."],["C","allowed many countries to follow the gold standard even though only the United States had very much gold."],["D","allowed the countries in the agreement to get the most seigniorage."],["E","caused Keynes to predict the rise of a dictator in Germany."]],"ans":"C","expl":"after WWII almost all the gold was in the US. Under Bretton Woods the US kept the dollar convertible into gold and other countries fixed their currencies to the dollar, so they were indirectly on the gold standard.","ansnote":"","sources":[{"code":"MT20","paper":"Midterm","session":"Spring 2023","course":"ECON10020","year":"2022/23","q":15}],"verified":"worked","flag":null,"sub":"M4","subtopic":"Central bank and open-market operations","paperlabels":null,"type":"Concept","diff":"Easy"}],"A":[{"stem":"In December 2025 a furniture maker produces a table worth €900 that it cannot sell before the year ends, so it is held in inventory. In March 2026 the maker sells the table to a customer. What is the effect of the March 2026 sale on 2026 GDP?","opts":[["A","It adds €900 to 2026 GDP."],["B","It adds nothing to 2026 GDP, because the table was already counted in 2025 GDP as inventory investment."],["C","It subtracts €900 from 2026 GDP."],["D","It adds €900 to 2025 GDP and a further €900 to 2026 GDP."]],"ans":"B","expl":"Correct: B. GDP counts production in the year it happens. In 2025 the unsold table is counted as inventory investment (+€900). In 2026 the sale is consumption (+€900), but inventories fall by €900, so the net effect on 2026 GDP is zero. A counts the table twice. C has the wrong sign. D counts it in both years, which is the double counting GDP is designed to avoid.","evidence":"Unsold output counted as inventory investment appears in Midterm 2025 Q2, Midterm 2023 Q4, the 2022/23 final Q24 and the 2023/24 final Q27 (practice Q2, Q10, Q11).","conf":"High","confwhy":"Inventory and timing questions appear in at least four papers, including both recent midterms.","id":"A001","n":1,"kind":"pred","topic":"GDP and national accounts","subtopic":"What counts in GDP","sub":"G2","type":"Calculation","diff":"Medium","table":null,"links":["P002","P010","P011"]},{"stem":"Given the following data for an economy, compute the value of GDP.\n\nConsumption expenditures 800; Imports 150; Government purchases of goods and services 300; Construction of new homes and apartments 120; Sales of existing homes and apartments 200; Exports 180; Government payments to unemployed workers 90; Business fixed investment 250; Beginning-of-year inventory 60; End-of-year inventory 40.","opts":[["A","1,480"],["B","1,500"],["C","1,570"],["D","1,680"]],"ans":"A","expl":"Correct: A. C = 800. I = new homes 120 + business fixed investment 250 + change in inventories (40 − 60 = −20) = 350. G = 300 (payments to the unemployed are transfers, so they are excluded). NX = 180 − 150 = 30. GDP = 800 + 350 + 300 + 30 = 1,480. B forgets that inventories fell. C wrongly includes the transfer payments (1,480 + 90). D wrongly includes sales of existing homes (1,480 + 200).","evidence":"The 'compute GDP / investment from this list' question appears in Midterm 2023 Q2 and Midterm 2025 Q11 with the same items and different numbers (practice Q8, Q9). It is the single most reused calculation.","conf":"High","confwhy":"Same list of items reused in both recent midterms, with new numbers each time.","id":"A002","n":2,"kind":"pred","topic":"GDP and national accounts","subtopic":"GDP calculations","sub":"G3","type":"Calculation","diff":"Hard","table":null,"links":["P008","P009"]},{"stem":"An economy produces only pizzas and haircuts. In 2024 (the base year) it produced 100 pizzas at €10 each and 50 haircuts at €20 each. In 2025 it produced 110 pizzas at €12 each and 50 haircuts at €25 each. Real GDP in 2025, measured in base-year prices, is:","opts":[["A","€2,570"],["B","€2,320"],["C","€2,000"],["D","€2,100"]],"ans":"D","expl":"Correct: D. Real GDP values current output at base-year prices: 110 × €10 + 50 × €20 = €1,100 + €1,000 = €2,100. A is 2025 nominal GDP (110 × €12 + 50 × €25). B mixes 2025 pizza prices with base-year haircut prices. C is 2024 GDP, which is both nominal and real because 2024 is the base year.","evidence":"Nominal GDP calculations appear in Midterm Fall 2022 Q4 and the 2022/23 final (practice Q14, Q23). A real GDP calculation has not been asked yet, although real versus nominal is a central midterm theme, so it is a gap in the evidence.","conf":"Medium","confwhy":"Nominal GDP is tested repeatedly; the real GDP version is the untested next step.","id":"A003","n":3,"kind":"pred","topic":"GDP and national accounts","subtopic":"GDP calculations","sub":"G3","type":"Calculation","diff":"Medium","table":null,"links":["P014","P023"]},{"stem":"A farmer sells wheat worth €300 to a miller. The miller sells flour worth €500 to a baker. The baker sells bread worth €900 to consumers. The value added by the miller is:","opts":[["A","€500"],["B","€300"],["C","€900"],["D","€200"]],"ans":"D","expl":"Correct: D. Value added is the value of a firm's output minus the intermediate goods it buys: €500 − €300 = €200. The three firms' value added sums to €300 + €200 + €400 = €900, which equals the final price of the bread. A is the miller's sales, not its value added. B is the cost of the wheat. C is the value of the final good.","evidence":"Value added appears in the 2023/24 final (orange juice, practice Q12), the Spring 2022/23 final (car windshield, practice Q25) and Midterm Fall 2022 Q2 (sum of value added, practice Q21).","conf":"Medium","confwhy":"Appears in several papers but has not appeared on a recent midterm.","id":"A004","n":4,"kind":"pred","topic":"GDP and national accounts","subtopic":"GDP calculations","sub":"G3","type":"Calculation","diff":"Medium","table":null,"links":["P012","P021","P025"]},{"stem":"Aoife buys a new car made in Germany for €30,000 from an Irish dealer who imported it and sells it at cost (ignore the dealer's margin). What is the effect on Irish GDP?","opts":[["A","GDP rises by €30,000."],["B","GDP is unchanged, because consumption rises by €30,000 and net exports fall by €30,000."],["C","GDP falls by €30,000."],["D","GDP rises by €30,000 because investment also rises."]],"ans":"B","expl":"Correct: B. The purchase raises consumption by €30,000, but the car is imported, so imports rise by €30,000 and net exports (X − M) fall by €30,000. The net effect on GDP is zero, since GDP counts only goods produced domestically. A ignores the import. C wrongly lets imports lower GDP twice. D adds an investment effect that does not exist.","evidence":"Imports appear as a subtraction in the GDP lists in Midterm 2023 Q2 and Midterm 2025 Q11 and in the 2022/23 Spring final (practice Q8, Q9, Q26). The course notes flag 'why imports are subtracted' as a concept to explain, but no past question has tested it directly.","conf":"Medium","confwhy":"The concept is in the notes and in every GDP calculation, but not yet tested on its own.","id":"A005","n":5,"kind":"pred","topic":"GDP and national accounts","subtopic":"What counts in GDP","sub":"G2","type":"Calculation","diff":"Medium","table":null,"links":["P008","P009","P026"]},{"stem":"A mechanic is paid €200 in cash for a repair and neither the mechanic nor the customer reports the transaction. Compared with the true level of production in the economy, measured GDP is:","opts":[["A","too high, because cash payments are counted twice"],["B","too low, because the repair is market production that is never recorded"],["C","unaffected, because repairs are intermediate goods"],["D","too low, because cash is not part of the money supply"]],"ans":"B","expl":"Correct: B. The repair is a genuine sale of a service, so it should be part of GDP, but because it is unreported it is missed. Measured GDP understates production when activity is hidden from the statistics. A is wrong because nothing is counted twice. C is wrong because a repair for a household is a final service. D confuses money with output.","evidence":"Limits of GDP is the most repeated GDP theme: Midterm 2025 Q5 and Q14, Midterm 2023 Q3 and Q5, and the 2025/26 final Q24 and Q25 (practice Q15 to Q20). The underground economy has not appeared, so this is an extension of that theme.","conf":"Low","confwhy":"The theme is frequent, but this specific example has no direct precedent in the supplied papers.","id":"A006","n":6,"kind":"pred","topic":"GDP and national accounts","subtopic":"Limits of GDP","sub":"G4","type":"Concept","diff":"Easy","table":null,"links":["P015","P016","P017","P018","P019","P020"]},{"stem":"The consumer price index for an economy consists of only apples and cheese. In the base year the typical consumer bought 20 apples at €1 each and 10 blocks of cheese at €4 each. In year 2 the price of apples is €1.50 and the price of cheese is €5. The typical consumer now buys 15 apples and 15 blocks of cheese. The CPI for year 2 equals:","opts":[["A","1.30"],["B","1.50"],["C","0.75"],["D","1.33"]],"ans":"D","expl":"Correct: D. The CPI uses the base-year basket: it prices 20 apples and 10 blocks of cheese at year-2 prices (20 × €1.50 + 10 × €5 = €80) and divides by their base-year cost (20 × €1 + 10 × €4 = €60). CPI = 80/60 = 1.33. A is the trap of using year-2 quantities ((15 × 1.5 + 15 × 5)/(15 × 1 + 15 × 4) = 1.30). B averages the two price increases. C is the inverse of the correct ratio.","evidence":"A CPI basket calculation appears in Midterm 2025 Q8 (table), Midterm Fall 2022 Q8 (books and hamburgers) and the 2023/24 final (practice Q30, Q31, Q49).","conf":"High","confwhy":"Appears in both a 2022 and a 2025 midterm, each time with the base-year-basket trap.","id":"A007","n":7,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"CPI: definition and calculation","sub":"P1","type":"Calculation","diff":"Medium","table":null,"links":["P030","P031","P049"]},{"stem":"The CPI was 1.25 in year one and 1.30 in year two. The rate of inflation between the two years was:","opts":[["A","4.0 percent"],["B","5.0 percent"],["C","3.8 percent"],["D","0.5 percent"]],"ans":"A","expl":"Correct: A. Inflation = (1.30 − 1.25)/1.25 = 0.04 = 4.0 percent. B is the change in index points multiplied by 100, which ignores the starting level. C divides by the new CPI (0.05/1.30). D misplaces the decimal.","evidence":"Inflation from two CPI values appears in the 2022/23 final (Q27), the Spring 2022/23 final (Q26) and the 2025/26 final (Q26), plus Midterm 2023 Q8 and Q9 (practice Q32 to Q35, Q55).","conf":"High","confwhy":"The inflation-rate calculation appears in at least three finals and two midterms.","id":"A008","n":8,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Inflation rate and CPI bias","sub":"P2","type":"Calculation","diff":"Medium","table":null,"links":["P032","P033","P034","P035","P055"]},{"stem":"A worker earned €16 per hour in 2020, the base year (CPI = 1.00). In 2025 the CPI is 1.25 and she earns €20 per hour. Her real wage in 2025, in 2020 euros, is:","opts":[["A","€20, up 25 percent"],["B","€16, unchanged from 2020"],["C","€25, up 56 percent"],["D","€12.80, down 20 percent"]],"ans":"B","expl":"Correct: B. Real wage = nominal wage/CPI = €20/1.25 = €16, the same as in 2020. Her pay rose 25 percent, exactly matching the 25 percent rise in prices. A reads the nominal wage as real. C multiplies by the CPI instead of dividing. D divides the 2020 wage by the CPI.","evidence":"Real-wage questions appear in Midterm 2025 Q4, Midterm Spring 2023 Q7 (Kathy), Midterm 2023 Q11 and the 2025/26 final (practice Q43 to Q45, Q52).","conf":"High","confwhy":"Real wage appears in every recent midterm in some form.","id":"A009","n":9,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Real vs nominal values","sub":"P3","type":"Calculation","diff":"Medium","table":null,"links":["P043","P044","P045","P052"]},{"stem":"An apartment rented for €1,200 a month in 2025. The CPI is 1.50 in 2025, with 2015 as the base year (CPI = 1.00). The 2025 rent expressed in 2015 euros is:","opts":[["A","€1,800"],["B","€1,200"],["C","€800"],["D","€600"]],"ans":"C","expl":"Correct: C. Convert a nominal value to base-year euros by dividing by the price index: €1,200/1.50 = €800. A multiplies instead of dividing. B leaves the figure nominal. D divides by 2.","evidence":"The 2022/23 Spring final (Q27) tests that you correct a nominal quantity by dividing by the price index (practice Q56). Calculation versions appear in Midterm 2023 Q11 and Midterm 2025 Q4 (practice Q43, Q44).","conf":"Medium","confwhy":"The rule is tested directly; this numerical conversion is a natural variant.","id":"A010","n":10,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Real vs nominal values","sub":"P3","type":"Calculation","diff":"Medium","table":null,"links":["P043","P044","P056"]},{"stem":"A pension of €12,000 a year is indexed to the CPI. The CPI rises from 1.60 to 1.68. The indexed pension is:","opts":[["A","€12,080"],["B","€12,600"],["C","€12,960"],["D","€13,000"]],"ans":"B","expl":"Correct: B. Indexing raises the nominal amount by the percentage rise in the CPI: 1.68/1.60 = 1.05, so the new pension is €12,000 × 1.05 = €12,600. A adds the 0.08 index points as euros. C treats the 0.08 change as 8 percent (×1.08). D is a round-number guess.","evidence":"The 2022/23 final (Q29, practice Q42) tests the definition of indexation (raising a nominal quantity each period by the percentage rise in a price index).","conf":"Medium","confwhy":"The definition has been tested; a worked calculation is the likely extension.","id":"A011","n":11,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Real vs nominal values","sub":"P3","type":"Calculation","diff":"Medium","table":null,"links":["P042"]},{"stem":"The real interest rate is 3 percent and inflation is 5 percent. Using the approximation r ≈ i − π, the nominal interest rate is about:","opts":[["A","2 percent"],["B","8 percent"],["C","15 percent"],["D","5 percent"]],"ans":"B","expl":"Correct: B. Rearrange r ≈ i − π to i ≈ r + π = 3 + 5 = 8 percent. A subtracts inflation from the real rate (r − π). C multiplies. D is the inflation rate alone.","evidence":"The relationship r ≈ i − π appears in Midterm 2023 Q12, the 2025/26 final (Q29) and the 2023/24 final (Q30) (practice Q46 to Q48). Past questions always solve for r; solving for i is the untested reverse.","conf":"Medium","confwhy":"The relationship is tested almost every year; this is the reverse direction.","id":"A012","n":12,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Real and nominal interest rates","sub":"P4","type":"Calculation","diff":"Medium","table":null,"links":["P046","P047","P048"]},{"stem":"A borrower takes out a loan with a fixed nominal interest rate. Over the life of the loan inflation turns out to be higher than both parties expected. Compared with what was expected:","opts":[["A","the lender gains, because the real interest rate is higher"],["B","the borrower gains, because the real interest rate is lower"],["C","neither side is affected, because the nominal rate is fixed"],["D","both sides gain, because the nominal value of the loan rises"]],"ans":"B","expl":"Correct: B. With the nominal rate fixed, higher inflation than expected means r ≈ i − π is lower than expected. The borrower repays in euros that buy less, so the borrower gains and the lender loses. A has the sign reversed. C ignores that real returns depend on inflation. D is impossible: one side's gain is the other's loss.","evidence":"The 2023/24 final (Q30, practice Q48) shows unexpectedly high inflation lowers the real interest rate. The lecture notes link this to the farmers' argument for bimetallism.","conf":"Medium","confwhy":"The underlying relationship is tested; asking who gains is a natural application.","id":"A013","n":13,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Real and nominal interest rates","sub":"P4","type":"Concept","diff":"Easy","table":null,"links":["P048"]},{"stem":"Last year the CPI rose by 3 percent. This year it rose by 2 percent. Which statement is correct?","opts":[["A","The economy is experiencing deflation."],["B","Prices are still rising, but the inflation rate has fallen (disinflation)."],["C","The price level fell this year."],["D","Real wages must have risen."]],"ans":"B","expl":"Correct: B. A positive inflation rate means prices are still rising. When the rate falls from 3 to 2 percent that is disinflation, not deflation. Deflation needs a negative inflation rate (a falling CPI). A and C confuse the two. D cannot be concluded without knowing nominal wage growth.","evidence":"Midterm 2023 Q9 (practice Q33) tests deflation using a falling CPI (0.171 to 0.167), so the inflation-versus-deflation distinction is examined.","conf":"Low","confwhy":"Only one related question exists; disinflation itself has not been asked.","id":"A014","n":14,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Inflation rate and CPI bias","sub":"P2","type":"Concept","diff":"Easy","table":null,"links":["P033"]},{"stem":"All of the following are real quantities EXCEPT the:","opts":[["A","number of cars sold in a month"],["B","hours worked in a factory"],["C","GDP measured at base-year prices"],["D","euro value of cars sold in a month at current prices"]],"ans":"D","expl":"Correct: D. A real quantity is measured in physical units or at constant prices. A euro value at current prices is a nominal quantity because it changes when prices change. A and B are physical quantities. C is real GDP by definition.","evidence":"EXCEPT-style real/nominal questions appear in Midterm 2025 Q7, Midterm 2023 Q10 and the 2023/24 final (Q29) (practice Q38 to Q40).","conf":"Medium","confwhy":"The format has appeared in four papers, but the items change each time.","id":"A015","n":15,"kind":"pred","topic":"Prices, CPI, real and nominal values, interest rates","subtopic":"Real vs nominal values","sub":"P3","type":"EXCEPT","diff":"Easy","table":null,"links":["P038","P039","P040"]},{"stem":"In an economy planned aggregate expenditure is PAE = 1,200 + 0.7Y and potential output Y* is 4,500. The economy has:","opts":[["A","an expansionary gap of 500"],["B","a recessionary gap of 4,000"],["C","no output gap"],["D","a recessionary gap of 500"]],"ans":"D","expl":"Correct: D. Short-run equilibrium is where Y = PAE: Y = 1,200/(1 − 0.7) = 4,000. Since Y = 4,000 is below Y* = 4,500, the output gap Y* − Y = 500 is positive, a recessionary gap. A has the sign reversed. B reports the equilibrium output, not the gap. C ignores the calculation.","evidence":"2023/24 final Q18 (PAE = 2,000 + 0.8Y, Y* = 11,000), Midterm 2025 Q15 and the Spring 2022/23 final Q13 test the gap sign (practice Q78, Q79, Q97).","conf":"High","confwhy":"Gap-sign questions appear in the 2025 midterm and two finals.","id":"A016","n":16,"kind":"pred","topic":"Recessions, output gaps, unemployment, Keynesian assumption","subtopic":"Fluctuations, gaps and unemployment","sub":"K1","type":"Calculation","diff":"Medium","table":null,"links":["P078","P079","P097"]},{"stem":"The actual unemployment rate is 8 percent and the natural rate of unemployment is 5 percent. Cyclical unemployment is:","opts":[["A","13 percentage points"],["B","5 percentage points"],["C","3 percentage points"],["D","8 percentage points"]],"ans":"C","expl":"Correct: C. Cyclical unemployment is actual minus natural unemployment (u − u*) = 8 − 5 = 3 percentage points. A adds the rates. B is the natural rate. D is the actual rate.","evidence":"Cyclical unemployment appears in the 2022/23 final (Q3) and the 2023/24 final (Q11) (practice Q60, Q61); the course notes define it as u − u*.","conf":"Medium","confwhy":"The concept is tested in two finals; a numerical version is the extension.","id":"A017","n":17,"kind":"pred","topic":"Recessions, output gaps, unemployment, Keynesian assumption","subtopic":"Fluctuations, gaps and unemployment","sub":"K1","type":"Calculation","diff":"Medium","table":null,"links":["P060","P061"]},{"stem":"Firms produce output of 1,000, but planned aggregate expenditure at that level of output is 900. What happens to inventories, and what do firms do next?","opts":[["A","Unplanned inventories rise by 100, and firms cut production."],["B","Unplanned inventories fall by 100, and firms raise production."],["C","Inventories do not change, because the economy is in equilibrium."],["D","Unplanned inventories rise by 900, and firms raise prices."]],"ans":"A","expl":"Correct: A. Production (1,000) exceeds planned spending (900), so 100 of output goes unsold and piles up as unplanned inventory. With prices fixed in the short run, firms reduce production until output equals PAE. B has the sign reversed. C is wrong because equilibrium needs Y = PAE. D is wrong on the amount, and the Keynesian model holds prices fixed in the short run.","evidence":"The unplanned-inventory question (Selene's Mirror Company, expecting to sell 1,000,000 and producing 1,250,000) appears in both the 2022/23 and 2023/24 finals (practice Q71).","conf":"Medium","confwhy":"Appeared in two consecutive finals, never yet on a midterm.","id":"A018","n":18,"kind":"pred","topic":"Keynesian cross, multipliers and stabilization policy","subtopic":"Planned expenditure and the Keynesian cross","sub":"K2","type":"Calculation","diff":"Medium","table":null,"links":["P071"]},{"stem":"In an economy consumption is C = 200 + 0.6(Y − T), net taxes are fixed at T = 100, planned investment is 150, government purchases are 100 and net exports are 0. Short-run equilibrium output equals:","opts":[["A","975"],["B","1,125"],["C","650"],["D","390"]],"ans":"A","expl":"Correct: A. Autonomous expenditure E = 200 − 0.6 × 100 + 150 + 100 + 0 = 390, and Y = E/(1 − c) = 390/0.4 = 975. B ignores the effect of taxes on consumption (450/0.4). C divides by c instead of (1 − c). D is autonomous expenditure without the multiplier.","evidence":"The same set-up with net taxes appears in the 2022/23 final (Q8, Macroland) and the 2023/24 final (Q16, Econland) (practice Q73, Q74). Equilibrium output also appears in Midterm 2025 Q12 and Q15.","conf":"High","confwhy":"Equilibrium output with net taxes is reused in two finals and the 2025 midterm.","id":"A019","n":19,"kind":"pred","topic":"Keynesian cross, multipliers and stabilization policy","subtopic":"Equilibrium output","sub":"K3","type":"Calculation","diff":"Medium","table":null,"links":["P073","P074"]},{"stem":"Planned aggregate expenditure is PAE = 500 + 0.8Y. Autonomous investment rises by 20. By how much does short-run equilibrium output change?","opts":[["A","It rises by 20."],["B","It rises by 100."],["C","It rises by 16."],["D","It rises by 120."]],"ans":"B","expl":"Correct: B. The multiplier is 1/(1 − 0.8) = 5, so the change in output is 5 × 20 = 100. A ignores the multiplier. C multiplies by c instead of the multiplier. D adds the original change to the multiplied effect.","evidence":"Midterm 2025 Q12 (autonomous spending falls from 400 to 200) and the 2022/23 final Q13 (a €1 billion rise in autonomous consumption) test the multiplied change in output (practice Q76, Q81).","conf":"High","confwhy":"Both recent exam years include a multiplier-times-change question.","id":"A020","n":20,"kind":"pred","topic":"Keynesian cross, multipliers and stabilization policy","subtopic":"Equilibrium output","sub":"K3","type":"Calculation","diff":"Medium","table":null,"links":["P076","P081"]},{"stem":"In an economy C = 100 + 0.8Y, imports are M = 0.2Y, and all other components of expenditure are fixed. The multiplier is:","opts":[["A","5"],["B","2.5"],["C","4"],["D","1.25"]],"ans":"B","expl":"Correct: B. Imports drain spending out of each round, so the slope of PAE is c − m = 0.8 − 0.2 = 0.6 and the multiplier is 1/(1 − 0.6) = 2.5. A ignores imports. C uses 1/(1 − c + m... ) incorrectly (1/(1 − 0.75)). D divides by 0.8 instead.","evidence":"The 2022/23 final Q14 (imports = 50 + 0.1Y, multiplier 5) and Midterm Spring 2023 Q2 (a taste for foreign goods lowers the multiplier) test this idea (practice Q84, Q93). The lecture notes say not to memorise 1/(1 − c) but to know what imports do to it.","conf":"Medium","confwhy":"Appears twice and the lecturer's notes emphasise it, but a midterm has not yet asked for it.","id":"A021","n":21,"kind":"pred","topic":"Keynesian cross, multipliers and stabilization policy","subtopic":"Multipliers","sub":"K4","type":"Calculation","diff":"Medium","table":null,"links":["P084","P093"]},{"stem":"In a Keynesian model, C = C̄ + 0.7Y and investment is I = Ī + 0.1Y. All other components are fixed. The multiplier is:","opts":[["A","3.33"],["B","5"],["C","10"],["D","1.25"]],"ans":"B","expl":"Correct: B. PAE has slope c + z = 0.7 + 0.1 = 0.8, so the multiplier is 1/(1 − 0.8) = 5. A ignores induced investment (1/(1 − 0.7)). C uses 1/0.1 and ignores consumption. D divides by 0.8.","evidence":"Induced investment multipliers appear in Midterm Spring 2023 Q1 and the 2025/26 final Q30 (practice Q85, Q92). The most recent final examined it.","conf":"Medium","confwhy":"Tested in a midterm of the sister course and in the most recent final.","id":"A022","n":22,"kind":"pred","topic":"Keynesian cross, multipliers and stabilization policy","subtopic":"Multipliers","sub":"K4","type":"Calculation","diff":"Medium","table":null,"links":["P085","P092"]},{"stem":"A government introduces a tax equal to 20 percent of each extra euro of income. Everything else is unchanged. The Keynesian expenditure multiplier will:","opts":[["A","rise"],["B","fall"],["C","stay the same"],["D","fall only if government spending also falls"]],"ans":"B","expl":"Correct: B. With an income tax, part of each round of extra income goes to the government and is not spent, so each round is smaller and the multiplier falls. A has the wrong direction. C and D are wrong because the tax changes the slope of PAE directly.","evidence":"The lecture notes set the lecturer's exercise: 'work out whether increasing income taxes makes the multiplier bigger or smaller'. The 2025/26 final Q9 asks which factors raise the multiplier (practice Q86).","conf":"Medium","confwhy":"Set as an explicit exercise in the course notes and tested by a related question in the latest final.","id":"A023","n":23,"
